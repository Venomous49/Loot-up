name: Apply RiseLooter visual patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* RISE_VISUAL_PATCH */'
          css='''
/* RISE_VISUAL_PATCH */
.hero{min-height:560px!important;position:relative!important;overflow:hidden!important;background:#070b0e!important}
.hero:after{content:""!important;position:absolute!important;inset:0!important;z-index:4!important;background:linear-gradient(90deg,rgba(5,9,13,.98) 0%,rgba(5,9,13,.95) 24%,rgba(5,9,13,.72) 36%,rgba(5,9,13,.14) 58%,rgba(5,9,13,0) 100%)!important;pointer-events:none!important}
.character-holder{position:absolute!important;inset:0!important;left:0!important;bottom:0!important;width:100%!important;height:100%!important;z-index:1!important;transform:none!important;display:block!important;overflow:hidden!important;animation:none!important}
.character-holder>div{width:100%!important;height:100%!important}
.character-holder img{width:100%!important;height:100%!important;object-fit:cover!important;object-position:center 47%!important;transform:scale(1.20) translateY(-1.5%)!important;filter:saturate(.94) contrast(1.04)!important;animation:riseSceneIdle 6s ease-in-out infinite!important}
@keyframes riseSceneIdle{0%,100%{transform:scale(1.20) translateY(-1.5%)}50%{transform:scale(1.205) translateY(-2.0%)}}
.hero-copy,.next-evolution,.hero-track{z-index:9!important}
.next-evolution{background:rgba(4,10,16,.93)!important}
.shadow-character{height:145px!important;margin:10px auto!important;overflow:hidden!important;border-radius:8px!important;position:relative!important;background:#080d12!important;box-shadow:inset 0 0 26px rgba(0,0,0,.72)!important}
.shadow-character img{width:100%!important;height:100%!important;max-width:none!important;object-fit:cover!important;object-position:center 44%!important;transform:scale(1.16)!important;filter:brightness(.20) grayscale(1) contrast(1.28)!important;opacity:1!important}
.evolution-character{overflow:hidden!important;border-radius:7px!important}
.evolution-card.locked .evolution-character img{width:100%!important;height:100%!important;object-fit:cover!important;object-position:center 44%!important;transform:scale(1.16)!important;filter:brightness(.18) grayscale(1) contrast(1.28)!important;opacity:1!important}
'''
          if marker not in s:
              s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply RiseLooter visual patch"
          git push
