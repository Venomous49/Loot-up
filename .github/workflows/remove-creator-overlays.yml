name: Remove creator preview overlays
on:
  push:
    paths:
      - 'scripts/remove_creator_overlays.py'
      - '.github/workflows/remove-creator-overlays.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove synthetic creator overlays
        run: python scripts/remove_creator_overlays.py
      - name: Commit site cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove synthetic creator overlays"
          git push
