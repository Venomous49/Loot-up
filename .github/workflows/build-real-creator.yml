name: Creator preset HD build

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_creator_fullbody_hd.py'
      - 'scripts/build_creator_from_hairstyle_masters.py'
      - 'scripts/validate_creator_library_hd.py'
      - 'assets/creator_sources/**'
      - 'creator-hd.css'
      - '.github/workflows/build-real-creator.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: riselooter-real-creator-hd
  cancel-in-progress: true

jobs:
  creator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic image dependencies
        run: python -m pip install --quiet 'numpy<3' pillow opencv-python-headless

      - name: Build and validate all 250 HD full-body presets
        id: hd_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/creator-hd-build.log
          python scripts/build_creator_fullbody_hd.py 2>&1 | tee -a /tmp/creator-hd-build.log
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            exit "$build_status"
          fi
          python scripts/validate_creator_library_hd.py 2>&1 | tee -a /tmp/creator-hd-build.log
          exit ${PIPESTATUS[0]}

      - name: Record failed HD build diagnostics
        if: steps.hd_build.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "status=failed"
            echo "source_commit=${GITHUB_SHA}"
            echo "--- tail ---"
            tail -n 160 /tmp/creator-hd-build.log || true
          } > creator-hd-build-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add creator-hd-build-status.txt
          git commit -m 'Record failed creator HD build diagnostics' || true
          git push || true
          exit 1

      - name: Setup Node for runtime verification
        if: steps.hd_build.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        if: steps.hd_build.outcome == 'success'
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static site for generated-library smoke test
        if: steps.hd_build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/riselooter-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/riselooter-http.log
          exit 1

      - name: Exercise every creator control against all generated assets
        if: steps.hd_build.outcome == 'success'
        run: node scripts/creator_runtime_smoke.mjs

      - name: Keep production routing source-owned
        if: steps.hd_build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- index.html
          test "$(git status --short index.html | wc -l)" -eq 0

      - name: Publish only validated creator assets
        if: steps.hd_build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          printf 'status=success\nsource_commit=%s\nformat=1728x910\nassets=250\n' "$GITHUB_SHA" > creator-hd-build-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/creator/male assets/creator/female creator-hd-build-status.txt
          if git diff --cached --quiet; then
            echo 'No creator changes to publish'
            exit 0
          fi
          git commit -m 'Publish unified HD full-body creator presets'
          git push
