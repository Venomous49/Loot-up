name: Creator safety build

on:
  push:
    paths:
      - 'scripts/final_site_cleanup.py'
      - '.github/workflows/build-real-creator.yml'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: riselooter-real-creator
  cancel-in-progress: true

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply safe complete-image creator mode
        run: python scripts/final_site_cleanup.py

      - name: Verify no synthetic creator overlays are active
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'cleanbase28' index.html
          grep -q 'creator-skin-overlay' index.html
          grep -q 'display:none!important' index.html
          grep -q '01-debutant.webp?v=cleanbase28' index.html

      - name: Publish safety patch when needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No safety changes to publish'
            exit 0
          fi
          git commit -m 'Use clean complete-image creator fallback'
          git push
