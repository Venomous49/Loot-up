name: Creator preset HD build

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_creator_fullbody_hd.py'
      - 'scripts/validate_creator_library_hd.py'
      - '.github/workflows/build-real-creator.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: riselooter-real-creator-hd
  cancel-in-progress: true

jobs:
  creator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic image dependencies
        run: python -m pip install --quiet 'numpy<3' pillow opencv-python-headless

      - name: Build all 250 presets in common 1728x910 full-body framing
        run: python scripts/build_creator_fullbody_hd.py

      - name: Validate full-body geometry, format and asset completeness
        run: python scripts/validate_creator_library_hd.py

      - name: Setup Node for runtime verification
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static site for generated-library smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/riselooter-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/riselooter-http.log
          exit 1

      - name: Exercise every creator control against all generated assets
        run: node scripts/creator_runtime_smoke.mjs

      - name: Keep production routing source-owned
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- index.html
          test "$(git status --short index.html | wc -l)" -eq 0

      - name: Publish only validated creator assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/creator/male assets/creator/female
          if git diff --cached --quiet; then
            echo 'No creator changes to publish'
            exit 0
          fi
          git commit -m 'Publish unified HD full-body creator presets'
          git push
