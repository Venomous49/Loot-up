name: Creator preset HD build

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_creator_fullbody_hd_v7.py'
      - 'scripts/build_layered_creator_v1.py'
      - 'scripts/validate_creator_fullbody_v7.py'
      - 'scripts/validate_creator_body_lock.py'
      - 'assets/creator_sources/fullbody/**'
      - 'creator-hd.css'
      - '.github/workflows/build-real-creator.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: riselooter-real-creator-hd
  cancel-in-progress: true

jobs:
  creator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic image dependencies
        run: python -m pip install --quiet 'numpy<3' pillow opencv-python-headless

      - name: Build immutable layered creator assets
        id: layered_build
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_layered_creator_v1.py

      - name: Build legacy male presets for compatibility
        id: hd_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/creator-hd-build.log
          python scripts/build_creator_fullbody_hd_v7.py 2>&1 | tee -a /tmp/creator-hd-build.log
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then exit "$build_status"; fi
          python scripts/validate_creator_fullbody_v7.py 2>&1 | tee -a /tmp/creator-hd-build.log
          validate_status=${PIPESTATUS[0]}
          if [ "$validate_status" -ne 0 ]; then exit "$validate_status"; fi
          python scripts/validate_creator_body_lock.py 2>&1 | tee -a /tmp/creator-hd-build.log
          exit ${PIPESTATUS[0]}

      - name: Record failed build diagnostics
        if: steps.hd_build.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "status=failed"
            echo "source_commit=${GITHUB_SHA}"
            echo "generator=layered-v1-plus-legacy-v7"
            echo "--- tail ---"
            tail -n 180 /tmp/creator-hd-build.log || true
          } > creator-hd-build-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add creator-hd-build-status.txt
          git commit -m 'Record failed creator build' || true
          git pull --rebase origin main || true
          git push || true
          exit 1

      - name: Publish layered assets and compatibility presets
        if: steps.hd_build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          printf 'status=success\nsource_commit=%s\ngenerator=layered-v1\ncanvas=1728x910\nimmutable_bases=2\nskin_overlays=10\ntransparent_hair_layers=50\nlegacy_male_assets=125\nbackground_locked=yes\nclothes_locked=yes\nbody_geometry_locked=yes\nlayered_runtime_ready=yes\n' "$GITHUB_SHA" > creator-hd-build-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/creator_layers assets/creator/male creator-hd-build-status.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Publish immutable layered creator assets'
            git pull --rebase origin main || true
            git push
          fi

      - name: Trigger public Cloudflare creator validation
        if: steps.hd_build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run creator-runtime-smoke.yml --ref main
