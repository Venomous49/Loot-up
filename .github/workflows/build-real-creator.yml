name: Creator preset HD build

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_creator_fullbody_hd.py'
      - 'scripts/build_creator_fullbody_hd_v5.py'
      - 'scripts/build_creator_from_hairstyle_masters.py'
      - 'scripts/validate_creator_library_hd.py'
      - 'scripts/validate_creator_body_lock.py'
      - 'scripts/creator_runtime_smoke.mjs'
      - 'assets/creator_sources/**'
      - 'creator-hd.css'
      - '.github/workflows/build-real-creator.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: riselooter-real-creator-hd
  cancel-in-progress: true

jobs:
  creator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic image dependencies
        run: python -m pip install --quiet 'numpy<3' pillow opencv-python-headless

      - name: Build immutable-base creator presets
        id: hd_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/creator-hd-build.log
          python scripts/build_creator_fullbody_hd_v5.py 2>&1 | tee -a /tmp/creator-hd-build.log
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then exit "$build_status"; fi
          python scripts/validate_creator_library_hd.py 2>&1 | tee -a /tmp/creator-hd-build.log
          validate_status=${PIPESTATUS[0]}
          if [ "$validate_status" -ne 0 ]; then exit "$validate_status"; fi
          python scripts/validate_creator_body_lock.py 2>&1 | tee -a /tmp/creator-hd-build.log
          exit ${PIPESTATUS[0]}

      - name: Record failed HD build diagnostics
        if: steps.hd_build.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "status=failed"
            echo "source_commit=${GITHUB_SHA}"
            echo "generator=immutable-base-v5"
            echo "--- tail ---"
            tail -n 180 /tmp/creator-hd-build.log || true
          } > creator-hd-build-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add creator-hd-build-status.txt
          git commit -m 'Record failed immutable-base creator build' || true
          git pull --rebase origin main || true
          git push || true
          exit 1

      - name: Verify generator did not rewrite application source
        if: steps.hd_build.outcome == 'success'
        run: git diff --exit-code -- index.html worker.js creator-hd.css wrangler.jsonc .assetsignore

      - name: Setup Node for browser validation
        if: steps.hd_build.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chromium smoke-test runtime
        if: steps.hd_build.outcome == 'success'
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start generated creator locally
        if: steps.hd_build.outcome == 'success'
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/rise-looter-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/rise-looter-http.log
          exit 1

      - name: Exercise all 250 combinations before publishing
        if: steps.hd_build.outcome == 'success'
        run: node scripts/creator_runtime_smoke.mjs

      - name: Publish only fully validated immutable-base assets
        if: steps.hd_build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          printf 'status=success\nsource_commit=%s\ngenerator=immutable-base-v5\nformat=1728x910\nassets=250\nbase_scene_untouched=yes\nbody_segmentation=disabled\nbody_crop_resize_repaste=disabled\nmale_full_body_locked=yes\nclothes_color_locked=yes\nskin_mask_face_neck_only=yes\nhair_scalp_only=yes\nhair_weak_alpha_halo=rejected\nhair_never_below_head=yes\nprepublish_runtime_combinations=250\n' "$GITHUB_SHA" > creator-hd-build-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/creator/male assets/creator/female creator-hd-build-status.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Publish immutable-base creator presets'
            git pull --rebase origin main || true
            git push
          fi

      - name: Trigger public Cloudflare creator validation
        if: steps.hd_build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run creator-runtime-smoke.yml --ref main
