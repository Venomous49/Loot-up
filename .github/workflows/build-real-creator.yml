name: Build real creator variants

on:
  push:
    paths:
      - 'scripts/build_real_creator_variants.py'
      - 'scripts/activate_real_creator.py'
      - '.github/workflows/build-real-creator.yml'
      - '01-debutant-character.png'
      - '01-debutant-background.webp'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: riselooter-real-creator
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic image dependencies
        run: python -m pip install --quiet 'numpy<3' opencv-python-headless

      - name: Generate real image variants
        run: python scripts/build_real_creator_variants.py

      - name: Patch creator to use generated files
        run: python scripts/activate_real_creator.py

      - name: Sanity checks
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/creator/male/medium/brown/male_textured.webp
          test -f assets/creator/male/light/blond/male_short.webp
          test -f assets/creator/male/dark/black/male_slick.webp
          COUNT=$(find assets/creator/male -type f -name '*.webp' | wc -l)
          echo "Generated $COUNT creator assets"
          test "$COUNT" -eq 125
          grep -q 'RISELOOTER_REAL_CREATOR_V23' index.html
          grep -q 'assets/creator/male/' index.html
          if grep -q 'creator-skin-overlay.*clip-path' index.html; then
            echo 'Legacy CSS exists in file but V23 hard-disables it; continuing.'
          fi

      - name: Commit only final creator assets and integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/creator/male
          if git diff --cached --quiet; then
            echo 'No creator changes to publish'
            exit 0
          fi
          git commit -m 'Publish real-time character creator assets'
          git push
