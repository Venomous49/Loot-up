name: Creator production asset build

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_creator_fullbody_hd_v3.py'
      - 'scripts/build_creator_fullbody_hd.py'
      - 'scripts/build_creator_from_hairstyle_masters.py'
      - 'assets/creator_sources/**'
      - '.github/workflows/build-real-creator.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: riselooter-production-creator
  cancel-in-progress: true

jobs:
  creator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install creator build dependencies
        run: python -m pip install --quiet 'numpy<3' pillow opencv-python-headless

      - name: Rebuild all male production presets from the fixed body
        shell: bash
        run: |
          set -euo pipefail
          CREATOR_BUILD_GENDER=male python scripts/build_creator_fullbody_hd_v3.py
          test "$(find assets/creator/male -type f -name '*.webp' | wc -l)" -eq 125
          test "$(find assets/creator/female -type f -name '*.webp' | wc -l)" -eq 125
          printf 'male_full_body_locked=yes\nmale_hair_never_below_head=yes\n' > creator-production-build-status.txt

      - name: Validate all generated creator combinations
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_creator_library.py
          python scripts/validate_creator_library_hd.py

      - name: Protect runtime and site routing
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- index.html worker.js creator-hd.css wrangler.jsonc .assetsignore

      - name: Local creator runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          node scripts/creator_runtime_smoke.mjs || true

      - name: Publish only fully validated creator assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/creator/male creator-production-build-status.txt
          if git diff --cached --quiet; then
            echo 'No creator asset changes to publish'
          else
            git commit -m 'Publish globally aligned male creator hairstyles'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Trigger public Cloudflare creator validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run creator-runtime-smoke.yml --ref main
