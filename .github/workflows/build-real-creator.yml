name: Creator layered HD build

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_layered_creator_v1.py'
      - 'scripts/clean_male_asset.py'
      - 'assets/creator_sources/fullbody/**'
      - '.github/workflows/build-real-creator.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: riselooter-layered-creator-v4
  cancel-in-progress: true

jobs:
  creator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'numpy<3' pillow opencv-python-headless 'rembg[cpu]'
      - name: Rebuild clean male source asset
        shell: bash
        run: |
          set -euo pipefail
          python scripts/clean_male_asset.py
          test -s assets/creator_sources/fullbody/male_base_clean.png
      - name: Remove every stale generated preset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/creator_layers
          mkdir -p assets/creator_layers
      - name: Generate fresh creator v4 presets only
        id: build
        shell: bash
        run: |
          set +e
          python scripts/build_layered_creator_v1.py > creator-layered-build-log.txt 2>&1
          code=$?
          set -e
          cat creator-layered-build-log.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Validate fresh outputs belong to this build
        id: validate
        if: steps.build.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          male=$(find assets/creator_layers/male -maxdepth 1 -type f -name '*.webp' | wc -l)
          female=$(find assets/creator_layers/female -maxdepth 1 -type f -name '*.webp' | wc -l)
          test "$male" -eq 31
          test "$female" -eq 31
          test -s assets/creator_layers/male/base.webp
          test -s assets/creator_layers/female/base.webp
          printf 'creator_version=layered-v4-clean-source\nsource_commit=%s\nmale_assets=%s\nfemale_assets=%s\n' "$GITHUB_SHA" "$male" "$female" > assets/creator_layers/manifest.txt
      - name: Record and publish build result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          code='${{ steps.build.outputs.exit_code }}'
          if [ "$code" = '0' ] && [ -f assets/creator_layers/manifest.txt ]; then state=success; else state=failure; fi
          printf 'status=%s\nsource_commit=%s\ngenerator=layered-v4-clean-source\ncanvas=1728x910\nstale_presets_removed=yes\n' "$state" "$GITHUB_SHA" > creator-layered-build-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/creator_sources/fullbody/male_base_clean.png assets/creator_layers creator-layered-build-status.txt creator-layered-build-log.txt
          if ! git diff --cached --quiet; then
            git commit -m "Publish creator layered-v4-clean-source $state"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          test "$state" = success
