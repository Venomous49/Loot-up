name: Build clean creator variants

on:
  push:
    paths:
      - 'scripts/build_real_creator_variants.py'
      - 'scripts/activate_real_creator.py'
      - 'scripts/final_site_cleanup.py'
      - '.github/workflows/build-real-creator.yml'
      - '01-debutant.webp'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: riselooter-real-creator
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic image dependencies
        run: python -m pip install --quiet 'numpy<3' opencv-python-headless

      - name: Generate clean image variants from validated full artwork
        run: python scripts/build_real_creator_variants.py

      - name: Patch creator to use generated files
        run: python scripts/activate_real_creator.py

      - name: Apply final site cleanup
        run: python scripts/final_site_cleanup.py

      - name: Sanity checks
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/creator/male/medium/brown/male_textured.webp
          test -f assets/creator/male/light/blond/male_short.webp
          test -f assets/creator/male/dark/black/male_slick.webp
          COUNT=$(find assets/creator/male -type f -name '*.webp' | wc -l)
          echo "Generated $COUNT creator assets"
          test "$COUNT" -eq 125
          grep -q 'RISELOOTER_REAL_CREATOR_V23' index.html
          grep -q 'RISELOOTER_FINAL_CLEAN_V25' index.html
          grep -q 'assets/creator/male/' index.html
          grep -q 'data-nav="missions"' index.html
          grep -q 'data-nav="challenges"' index.html
          grep -q 'data-nav="leaderboard"' index.html
          grep -q 'data-nav="referral"' index.html
          grep -q '#shop,#inventory,#dailyChest' index.html
          python - <<'PY'
          from pathlib import Path
          import cv2
          files=list(Path('assets/creator/male').rglob('*.webp'))
          assert len(files)==125
          for f in [
              Path('assets/creator/male/medium/brown/male_textured.webp'),
              Path('assets/creator/male/medium/blond/male_medium.webp'),
              Path('assets/creator/male/dark/black/male_slick.webp')]:
              im=cv2.imread(str(f))
              assert im is not None and im.size > 0, f
              assert im.std() > 15, f'near-blank asset: {f}'
          print('Image smoke tests passed')
          PY

      - name: Commit final creator assets and integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/creator/male
          if git diff --cached --quiet; then
            echo 'No creator changes to publish'
            exit 0
          fi
          git commit -m 'Publish clean character creator assets'
          git push
