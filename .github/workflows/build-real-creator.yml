name: Creator preset HD build

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_creator_fullbody_hd_v7.py'
      - 'scripts/validate_creator_fullbody_v7.py'
      - 'scripts/validate_creator_body_lock.py'
      - 'assets/creator_sources/fullbody/**'
      - 'creator-hd.css'
      - '.github/workflows/build-real-creator.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: riselooter-real-creator-hd
  cancel-in-progress: true

jobs:
  creator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic image dependencies
        run: python -m pip install --quiet 'numpy<3' pillow opencv-python-headless

      - name: Build dedicated fullbody male presets
        id: hd_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/creator-hd-build.log
          python scripts/build_creator_fullbody_hd_v7.py 2>&1 | tee -a /tmp/creator-hd-build.log
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then exit "$build_status"; fi
          python scripts/validate_creator_fullbody_v7.py 2>&1 | tee -a /tmp/creator-hd-build.log
          validate_status=${PIPESTATUS[0]}
          if [ "$validate_status" -ne 0 ]; then exit "$validate_status"; fi
          python scripts/validate_creator_body_lock.py 2>&1 | tee -a /tmp/creator-hd-build.log
          exit ${PIPESTATUS[0]}

      - name: Record failed dedicated fullbody build diagnostics
        if: steps.hd_build.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "status=failed"
            echo "source_commit=${GITHUB_SHA}"
            echo "generator=dedicated-fullbody-v7-male"
            echo "--- tail ---"
            tail -n 180 /tmp/creator-hd-build.log || true
          } > creator-hd-build-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add creator-hd-build-status.txt
          git commit -m 'Record failed dedicated fullbody creator build' || true
          git pull --rebase origin main || true
          git push || true
          exit 1

      - name: Publish dedicated fullbody male assets
        if: steps.hd_build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          printf 'status=success\nsource_commit=%s\ngenerator=dedicated-fullbody-v7-male\nformat=1728x910\nmale_assets=125\nfull_body_source=assets/creator_sources/fullbody/male_base.png\nfull_body_skin_mask=assets/creator_sources/fullbody/male_skin_mask.png\ndedicated_hair_layers=25\nhead_to_feet_required=yes\nbody_crop_resize_repaste=disabled\nmale_full_body_locked=yes\nclothes_color_locked=yes\nskin_mask_reviewed=yes\nhair_layers_precoloured=yes\nhair_background_extraction=disabled\nstatic_validation=passed\n' "$GITHUB_SHA" > creator-hd-build-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/creator/male creator-hd-build-status.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Publish dedicated fullbody male creator presets v7'
            git pull --rebase origin main || true
            git push
          fi

      - name: Trigger public Cloudflare creator validation
        if: steps.hd_build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run creator-runtime-smoke.yml --ref main
