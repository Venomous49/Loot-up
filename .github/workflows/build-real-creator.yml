name: Creator preset build

# Visual asset generation is intentionally manual-only.
# The creator library must never rewrite production assets just because a
# generator script changed: generated hair/skin variants require QA first.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: riselooter-real-creator
  cancel-in-progress: true

jobs:
  creator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic image dependencies
        run: python -m pip install --quiet 'numpy<3' pillow opencv-python-headless

      - name: Build presets from visually reviewed hairstyle masters
        run: python scripts/build_creator_from_hairstyle_masters.py

      - name: Validate generated creator library
        run: python scripts/validate_creator_library.py

      - name: Setup Node for runtime verification
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static site for generated-library smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/loot-up-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/loot-up-http.log
          exit 1

      - name: Exercise all creator controls against generated assets
        run: node scripts/creator_runtime_smoke.mjs

      - name: Prove generator did not touch production routing
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- index.html
          test "$(git status --short index.html | wc -l)" -eq 0

      - name: Publish only after successful static and browser validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/creator/male assets/creator/female
          if git diff --cached --quiet; then
            echo 'No creator changes to publish'
            exit 0
          fi
          git commit -m 'Publish visually-reviewed creator presets'
          git push
