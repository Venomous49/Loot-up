name: Creator preset build

on:
  push:
    paths:
      - 'scripts/build_real_creator_variants.py'
      - 'scripts/build_female_creator_variants.py'
      - 'scripts/final_site_cleanup.py'
      - '.github/workflows/build-real-creator.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: riselooter-real-creator
  cancel-in-progress: true

jobs:
  creator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic image dependencies
        run: python -m pip install --quiet 'numpy<3' opencv-python-headless

      - name: Generate 125 male full-image presets
        run: python scripts/build_real_creator_variants.py

      - name: Generate 125 female full-image presets
        run: python scripts/build_female_creator_variants.py

      - name: Enable direct full-image preset routing
        run: python scripts/final_site_cleanup.py

      - name: Validate creator library
        shell: bash
        run: |
          set -euo pipefail
          test "$(find assets/creator/male -type f -name '*.webp' | wc -l)" -eq 125
          test "$(find assets/creator/female -type f -name '*.webp' | wc -l)" -eq 125
          python - <<'PY'
          from pathlib import Path
          import cv2
          for gender in ('male','female'):
              root=Path('assets/creator')/gender
              files=list(root.rglob('*.webp'))
              assert len(files)==125,(gender,len(files))
              for f in files:
                  im=cv2.imread(str(f))
                  assert im is not None and im.size>0,f
                  assert im.std()>10,f'near blank: {f}'
          checks=[
            ('assets/creator/male/medium/brown/male_textured.webp','assets/creator/male/medium/brown/male_short.webp'),
            ('assets/creator/male/medium/brown/male_short.webp','assets/creator/male/medium/brown/male_medium.webp'),
            ('assets/creator/male/light/blond/male_textured.webp','assets/creator/male/dark/black/male_textured.webp'),
            ('assets/creator/female/medium/brown/female_long.webp','assets/creator/female/medium/brown/female_short.webp'),
            ('assets/creator/female/light/blond/female_long.webp','assets/creator/female/dark/black/female_long.webp'),
          ]
          for a,b in checks:
              ia,ib=cv2.imread(a),cv2.imread(b)
              assert ia.shape==ib.shape,(a,b)
              delta=cv2.absdiff(ia,ib).mean()
              assert delta>0.28,(a,b,delta)
          print('250 complete-image creator presets validated')
          PY

      - name: Publish generated presets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/creator/male assets/creator/female index.html
          if git diff --cached --quiet; then
            echo 'No creator changes to publish'
            exit 0
          fi
          git commit -m 'Publish complete male and female avatar presets'
          git push
