name: Creator layered HD build

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_layered_creator_v1.py'
      - 'assets/creator_sources/fullbody/**'
      - '.github/workflows/build-real-creator.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: riselooter-layered-creator
  cancel-in-progress: true

jobs:
  creator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependencies
        run: python -m pip install --quiet 'numpy<3' pillow opencv-python-headless

      - name: Build and validate immutable layered assets
        shell: bash
        run: |
          set -euo pipefail
          echo 'forced layered build 2026-08-20'
          python scripts/build_layered_creator_v1.py

      - name: Publish layered assets
        shell: bash
        run: |
          set -euo pipefail
          printf 'status=success\nsource_commit=%s\ngenerator=layered-v1\ncanvas=1728x910\nimmutable_bases=2\nskin_overlays=10\ntransparent_hair_layers=50\nbackground_locked=yes\nclothes_locked=yes\nbody_geometry_locked=yes\nlayered_runtime_ready=yes\n' "$GITHUB_SHA" > creator-layered-build-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/creator_layers creator-layered-build-status.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Publish layered creator assets'
            git pull --rebase origin main
            git push
          fi

      - name: Trigger public validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run creator-runtime-smoke.yml --ref main
