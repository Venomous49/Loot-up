name: Creator layered HD build

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_layered_creator_v1.py'
      - 'assets/creator_sources/fullbody/**'
      - '.github/workflows/build-real-creator.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: riselooter-layered-creator
  cancel-in-progress: true

jobs:
  creator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'numpy<3' pillow opencv-python-headless
      - name: Generate and validate final layered creator
        id: build
        shell: bash
        run: |
          set +e
          python scripts/build_layered_creator_v1.py > creator-layered-build-log.txt 2>&1
          code=$?
          set -e
          cat creator-layered-build-log.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Record build diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          code='${{ steps.build.outputs.exit_code }}'
          if [ "$code" = '0' ]; then state=success; else state=failure; fi
          printf 'status=%s\nsource_commit=%s\ngenerator=layered-v1\ncanvas=1728x910\n' "$state" "$GITHUB_SHA" > creator-layered-build-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add creator-layered-build-status.txt creator-layered-build-log.txt
          if [ "$code" = '0' ]; then git add assets/creator_layers; fi
          if ! git diff --cached --quiet; then
            git commit -m "Record layered creator build $state"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Fail when creator generation failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
