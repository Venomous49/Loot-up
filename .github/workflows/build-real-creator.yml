name: Creator preset build

# Visual asset generation is intentionally manual-only.
# The creator library must never rewrite production assets just because a
# generator script changed: generated hair/skin variants require QA first.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: riselooter-real-creator
  cancel-in-progress: true

jobs:
  creator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic image dependencies
        run: python -m pip install --quiet 'numpy<3' opencv-python-headless

      - name: Generate male full-image presets
        run: python scripts/build_real_creator_variants.py

      - name: Generate female full-image presets
        run: python scripts/build_female_creator_variants.py

      - name: Apply direct full-image routing
        run: python scripts/final_site_cleanup.py

      - name: Validate generated creator library
        run: python scripts/validate_creator_library.py

      - name: Publish only after successful validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/creator/male assets/creator/female index.html
          if git diff --cached --quiet; then
            echo 'No creator changes to publish'
            exit 0
          fi
          git commit -m 'Publish visually-reviewed creator presets'
          git push
