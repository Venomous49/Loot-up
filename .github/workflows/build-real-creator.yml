name: Creator preset routing

on:
  push:
    paths:
      - 'scripts/final_site_cleanup.py'
      - '.github/workflows/build-real-creator.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: riselooter-real-creator
  cancel-in-progress: true

jobs:
  creator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enable complete-image avatar presets
        run: python scripts/final_site_cleanup.py

      - name: Verify preset routing
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'assets/creator/${avatarDraft.gender}/${avatarDraft.skin}/${avatarDraft.hairColor}/${avatarDraft.hairStyle}.webp?v=presets29' index.html
          grep -q 'assets/creator/${avatarDraft.gender}/${avatarDraft.skin}/${avatarDraft.hairColor}/${value}.webp?v=presets29' index.html
          grep -q 'creator-skin-overlay' index.html
          grep -q 'display:none!important' index.html

      - name: Publish creator routing patch when needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No creator routing changes to publish'
            exit 0
          fi
          git commit -m 'Enable full-image avatar preset routing'
          git push
