name: Clean RiseLooter stage artwork

on:
  push:
    branches: [ main ]
    paths:
      - '.github/scripts/clean_stage_art.py'
      - '.github/workflows/clean-stage-art.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_REF: 01e0cf95075b52d5635e9402d06ce17e18f45a03
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install opencv-python-headless numpy
      - name: Clean and upscale all 8 stage images
        run: |
          python .github/scripts/clean_stage_art.py
      - name: Verify only stage artwork changed
        run: |
          set -euo pipefail
          CHANGED=$(git status --short | awk '{print $2}')
          test -n "$CHANGED"
          while read -r f; do
            case "$f" in
              assets/characters/male/medium/brown/male_textured/*.webp) ;;
              *) echo "Unexpected changed file: $f"; exit 1;;
            esac
          done <<< "$CHANGED"
      - name: Commit cleaned Ultra HD artwork
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/characters/male/medium/brown/male_textured/*.webp
          git commit -m 'Nettoyer définitivement les 8 visuels de paliers'
          git pull --rebase origin main
          git push origin HEAD:main
