name: Apply creator interface
on:
  push:
    paths:
      - 'scripts/apply_creator_interface.py'
      - '.github/workflows/apply-creator-interface.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch first-login creator
        run: python scripts/apply_creator_interface.py
      - name: Commit site update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Integrate live character creator interface"
          git push
