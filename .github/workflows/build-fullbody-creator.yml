name: Build full-body creator

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/build_creator_fullbody.py'
      - '01-debutant-character.png'
      - 'assets/creator/female/**'
      - 'assets/creator_sources/creator_background_master.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install opencv-python-headless numpy
      - run: python .github/scripts/build_creator_fullbody.py
      - name: Commit generated full-body assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/creator_sources/fullbody/
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'Generate canonical full-body creator assets'
            git push
          fi
