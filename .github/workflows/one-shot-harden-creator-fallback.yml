name: One-shot harden creator fallback

on:
  push:
    paths:
      - '.github/workflows/one-shot-harden-creator-fallback.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install validators
        run: |
          python -m pip install --quiet 'numpy<3' opencv-python-headless
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Harden creator fallback and runtime regression
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s, n = re.subn(
              r'function creatorFallbackPath\(gender=avatarDraft\.gender\)\{\s*const style = gender === "female" \? "female_long" : "male_textured";\s*return creatorAssetPath\(\{gender,skin:"medium",hairColor:"brown",hairStyle:style\}\);\s*\}',
              'function creatorFallbackPath(gender=avatarDraft.gender,skin=avatarDraft.skin,hairColor=avatarDraft.hairColor){\n  const style = gender === "female" ? "female_long" : "male_textured";\n  return creatorAssetPath({gender,skin,hairColor,hairStyle:style});\n}',
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'creatorFallbackPath replacement count={n}')

          s, n = re.subn(
              r'const fallback=stage===0\s*\? creatorFallbackPath\(gender\)',
              'const fallback=stage===0\n  ? creatorFallbackPath(gender, profile?.avatar_skin || "medium", profile?.avatar_hair_color || "brown")',
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'characterHTML fallback replacement count={n}')

          old = "onload=\"document.getElementById('saveAvatar').disabled=false\""
          new = "onload=\"document.getElementById('saveAvatar').disabled=this.dataset.triedFallback==='1'\""
          if s.count(old) != 1:
              raise SystemExit(f'creator preview onload count={s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          mpath = Path('scripts/creator_runtime_smoke.mjs')
          m = mpath.read_text(encoding='utf-8')
          anchor = "  const saveDisabled = await page.locator('#saveAvatar').isDisabled();\n  if (saveDisabled) failures.push('saveAvatar remains disabled after valid preset loads');"
          if anchor not in m:
              raise SystemExit('runtime smoke anchor missing')
          extra = r'''

  await page.locator('#genderChoices [data-value="male"]').click();
  await page.locator('#skinChoices [data-value="light"]').click();
  await page.locator('#hairColorChoices [data-value="red"]').click();
  const blockedPattern = '**/assets/creator/male/light/red/male_short.webp*';
  await page.route(blockedPattern, route => route.abort());
  await page.locator('#hairStyleChoices [data-value="male_short"]').click();
  await page.waitForFunction(() => {
    const img = document.querySelector('#creatorPreview img.creator-real-preview');
    return !!img && img.dataset.triedFallback === '1' && img.complete && img.naturalWidth > 0;
  }, { timeout: 15000 });
  const fallbackSrc = await previewPath();
  if (!fallbackSrc || !fallbackSrc.includes('assets/creator/male/light/red/male_textured.webp')) {
    failures.push(`forced missing preset used wrong fallback: ${fallbackSrc}`);
  }
  if (!(await page.locator('#saveAvatar').isDisabled())) {
    failures.push('saveAvatar became enabled even though selected preset required fallback');
  }
  await page.unroute(blockedPattern);
  await page.locator('#hairStyleChoices [data-value="male_textured"]').click();
  await waitForLoadedImage('#creatorPreview img.creator-real-preview');
  if (await page.locator('#saveAvatar').isDisabled()) {
    failures.push('saveAvatar did not recover after returning to valid primary preset');
  }'''
          if 'forced missing preset used wrong fallback' not in m:
              m = m.replace(anchor, anchor + extra, 1)
          mpath.write_text(m, encoding='utf-8')
          PY
          rm .github/workflows/one-shot-harden-creator-fallback.yml
      - name: Validate creator library
        run: python scripts/validate_creator_library.py
      - name: Start static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/loot-up-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/loot-up-http.log
          exit 1
      - name: Exercise creator including forced fallback failure
        run: node scripts/creator_runtime_smoke.mjs
      - name: Publish verified fallback hardening
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --quiet && exit 0
          git commit -m 'Harden creator fallback integrity'
          git push origin HEAD:main
