name: Temporary creator control sync

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temp-creator-control-sync.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch creator control synchronization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          helper='''function syncChoiceSelections(){
          const groups = [
            ["genderChoices","gender"],
            ["skinChoices","skin"],
            ["hairColorChoices","hairColor"]
          ];
          groups.forEach(([id,field]) => {
            const root = $(id);
            if(!root) return;
            root.querySelectorAll(".choice").forEach(btn => {
              btn.classList.toggle("selected", btn.dataset.value === avatarDraft[field]);
            });
          });
          }

          '''
          anchor='/* ==========================================================\nTRACK\n========================================================== */'
          if 'function syncChoiceSelections(){' not in s:
              if anchor not in s:
                  raise SystemExit('track anchor missing')
              s=s.replace(anchor, helper+anchor, 1)
          start=s.find('if(\n!data.avatar_customized\n){')
          if start < 0:
              raise SystemExit('avatar customization block missing')
          end=s.find('$("creatorModal")', start)
          if end < 0:
              raise SystemExit('creator modal anchor missing')
          block=s[start:end]
          if 'syncChoiceSelections();' not in block:
              marker='\nrenderHairChoices();\n\nupdateCreatorPreview();'
              if marker not in block:
                  raise SystemExit('creator render marker missing')
              block=block.replace(marker, '\nsyncChoiceSelections();\n\nrenderHairChoices();\n\nupdateCreatorPreview();', 1)
              s=s[:start]+block+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          grep -q '^function syncChoiceSelections(){' index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.index('if(\n!data.avatar_customized\n){')
          end=s.index('$("creatorModal")',start)
          block=s[start:end]
          assert block.count('syncChoiceSelections();') == 1
          assert block.index('syncChoiceSelections();') < block.index('renderHairChoices();')
          print('creator control sync patch structurally verified')
          PY
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static site
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/loot-up-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/loot-up-http.log
          exit 1
      - name: Run full creator smoke suite
        run: node scripts/creator_runtime_smoke.mjs
      - name: Verify loaded-profile control synchronization
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          await page.goto('http://127.0.0.1:4173/index.html?creatorTest=1',{waitUntil:'domcontentloaded'});
          await page.waitForSelector('#creatorModal.show');
          await page.evaluate(()=>{
            avatarDraft={gender:'female',skin:'dark',hairColor:'purple',hairStyle:'female_short'};
            syncChoiceSelections();
            renderHairChoices();
            updateCreatorPreview();
          });
          for (const [group,value] of [['genderChoices','female'],['skinChoices','dark'],['hairColorChoices','purple'],['hairStyleChoices','female_short']]) {
            const selected=page.locator(`#${group} .choice.selected`);
            if(await selected.count()!==1) throw new Error(`${group}: expected one selected control`);
            if(await selected.getAttribute('data-value')!==value) throw new Error(`${group}: wrong selected value`);
          }
          await page.waitForFunction(()=>{const i=document.querySelector('#creatorPreview img.creator-real-preview');return i&&i.complete&&i.naturalWidth>0;});
          const src=await page.locator('#creatorPreview img.creator-real-preview').getAttribute('src');
          if(!src.includes('assets/creator/female/dark/purple/female_short.webp')) throw new Error(`wrong preview ${src}`);
          await browser.close();
          console.log('loaded-profile creator control synchronization passed');
          NODE
      - name: Commit verified patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-creator-control-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/temp-creator-control-sync.yml
          git commit -m 'Synchronize creator controls with loaded avatar state'
          git push origin HEAD:main
