name: Apply RiseLooter static asset patch

# Rebuild exact character-only silhouettes from the validated master evolution art.
# Never rewrites index.html or creator routing.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/scripts/build_silhouettes.py'
      - '.github/workflows/fix-riselooter-assets.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image tools
        run: |
          python3 -m pip install --upgrade --quiet pip
          python3 -m pip install --quiet opencv-python-headless numpy pillow rembg onnxruntime

      - name: Build character-only silhouette previews
        run: |
          set -euo pipefail
          python3 .github/scripts/build_silhouettes.py
          for f in 01-debutant 05-debrouillard 10-chasseur 15-hustler 20-pro 30-elite 40-cyber-looter 50-rise-looter; do
            test -s "silhouettes/${f}.png"
            cp "silhouettes/${f}.png" "sil-${f}.png"
          done

      - name: Verify creator routing is untouched
        run: |
          set -euo pipefail
          git diff --exit-code -- index.html creator-safe-runtime.js

      - name: Commit exact silhouette assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add silhouettes/*.png sil-*.png
          if git diff --cached --quiet; then
            echo "No silhouette changes to commit"
            exit 0
          fi
          git commit -m "Refresh exact character-only evolution silhouettes"
          git push origin HEAD:main
