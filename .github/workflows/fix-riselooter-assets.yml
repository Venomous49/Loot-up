name: Clean RiseLooter stage artwork

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-riselooter-assets.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image tools
        run: |
          python3 -m pip install --upgrade --quiet pip
          python3 -m pip install --quiet opencv-python-headless numpy pillow

      - name: Restore pristine stage sources and clean labels safely
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT='1e7e03a8e390984c115b432e677d6283ae4c9410'
          BASE='assets/characters/male/medium/brown/male_textured'
          mkdir -p /tmp/stage-pristine
          for f in 01-debutant 05-debrouillard 10-chasseur 15-hustler 20-pro 30-elite 40-cyber-looter 50-rise-looter; do
            git show "$SOURCE_COMMIT:$BASE/$f.webp" > "/tmp/stage-pristine/$f.webp"
          done

          cat > /tmp/clean_stages.py <<'PY'
          import cv2, numpy as np, os

          names = ['01-debutant','05-debrouillard','10-chasseur','15-hustler','20-pro','30-elite','40-cyber-looter','50-rise-looter']
          src_dir='/tmp/stage-pristine'
          out_dir='assets/characters/male/medium/brown/male_textured'

          def person_protection(img):
              h,w=img.shape[:2]
              gc=np.zeros((h,w),np.uint8)
              rect=(int(w*.28), int(h*.01), int(w*.46), int(h*.98))
              bgd=np.zeros((1,65),np.float64)
              fgd=np.zeros((1,65),np.float64)
              cv2.grabCut(img,gc,rect,bgd,fgd,6,cv2.GC_INIT_WITH_RECT)
              person=np.where((gc==cv2.GC_FGD)|(gc==cv2.GC_PR_FGD),255,0).astype(np.uint8)
              person=cv2.morphologyEx(person,cv2.MORPH_CLOSE,np.ones((5,5),np.uint8),iterations=1)
              person=cv2.dilate(person,np.ones((9,9),np.uint8),iterations=1)
              return person

          def glyph_components(binary, min_area=3, max_ratio=.08):
              n,labels,stats,_=cv2.connectedComponentsWithStats(binary,8)
              kept=np.zeros_like(binary)
              limit=max(12,int(binary.size*max_ratio))
              for i in range(1,n):
                  x,y,ww,hh,area=stats[i]
                  if min_area <= area <= limit and 1 <= ww <= int(binary.shape[1]*.34) and 2 <= hh <= int(binary.shape[0]*.72):
                      kept[labels==i]=255
              return kept

          def selective_text_mask(img, protect):
              h,w=img.shape[:2]
              hsv=cv2.cvtColor(img,cv2.COLOR_BGR2HSV)
              gray=cv2.cvtColor(img,cv2.COLOR_BGR2GRAY)
              mask=np.zeros((h,w),np.uint8)

              # Top-left title: remove only detected glyph pixels, never a large block.
              y0,y1=int(h*.025),int(h*.245)
              x0,x1=int(w*.015),int(w*.50)
              roi_hsv=hsv[y0:y1,x0:x1]
              roi_gray=gray[y0:y1,x0:x1]
              white=((roi_hsv[:,:,1] < 120) & (roi_hsv[:,:,2] > 165) & (roi_gray > 155)).astype(np.uint8)*255
              kept=glyph_components(white,3,.055)
              kept=cv2.morphologyEx(kept,cv2.MORPH_CLOSE,np.ones((2,2),np.uint8),iterations=1)
              kept=cv2.dilate(kept,np.ones((3,3),np.uint8),iterations=1)
              mask[y0:y1,x0:x1]=cv2.max(mask[y0:y1,x0:x1],kept)

              # Bottom label: clean glyphs only. Never draw a rectangle over the feet.
              by0=int(h*.865); bx0=int(w*.10); bx1=int(w*.90)
              broi_hsv=hsv[by0:h,bx0:bx1]
              broi_gray=gray[by0:h,bx0:bx1]
              bright=((broi_hsv[:,:,1] < 125) & (broi_hsv[:,:,2] > 165) & (broi_gray > 155)).astype(np.uint8)*255
              bkept=glyph_components(bright,3,.035)
              bkept=cv2.morphologyEx(bkept,cv2.MORPH_CLOSE,np.ones((2,2),np.uint8),iterations=1)
              bkept=cv2.dilate(bkept,np.ones((3,3),np.uint8),iterations=1)
              mask[by0:h,bx0:bx1]=cv2.max(mask[by0:h,bx0:bx1],bkept)

              # Absolute safety rule: no repair pixel may touch the character or its immediate outline.
              mask[protect>0]=0
              return mask

          for name in names:
              src=os.path.join(src_dir,name+'.webp')
              img=cv2.imread(src,cv2.IMREAD_COLOR)
              if img is None:
                  raise RuntimeError(f'Cannot read {src}')

              protect=person_protection(img)
              mask=selective_text_mask(img,protect)
              overlap=int(np.count_nonzero((mask>0)&(protect>0)))
              if overlap:
                  raise RuntimeError(f'Unsafe cleanup mask intersects character for {name}: {overlap} px')
              coverage=float(np.count_nonzero(mask))/mask.size
              if coverage > .035:
                  raise RuntimeError(f'Cleanup mask unexpectedly large for {name}: {coverage:.4f}')

              # One tiny inpaint pass only on isolated background glyphs. No wide dilation,
              # no second pass and no rectangular repair, which were causing the face/feet smears.
              cleaned=cv2.inpaint(img,mask,2,cv2.INPAINT_TELEA) if np.any(mask) else img.copy()

              # UHD output while preserving all character pixels from the pristine source.
              up=cv2.resize(cleaned,None,fx=8,fy=8,interpolation=cv2.INTER_LANCZOS4)
              soft=cv2.GaussianBlur(up,(0,0),.65)
              sharp=cv2.addWeighted(up,1.10,soft,-0.10,0)

              out=os.path.join(out_dir,name+'.webp')
              ok=cv2.imwrite(out,sharp,[cv2.IMWRITE_WEBP_QUALITY,97])
              if not ok:
                  raise RuntimeError(f'Cannot write {out}')
              hh,ww=sharp.shape[:2]
              if hh < 3000 or ww < 2000:
                  raise RuntimeError(f'Unexpected UHD size for {name}: {ww}x{hh}')
              print(name, ww, hh, 'cleanup_px=', int(np.count_nonzero(mask)), 'coverage=', f'{coverage:.5f}')
          PY
          python3 /tmp/clean_stages.py

      - name: Bump stage cache version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worker.js')
          s=p.read_text()
          for old,new in [
              ('/fixed-stage-home.js?v=4','/fixed-stage-home.js?v=6'),
              ('/fixed-stage-home.js?v=5','/fixed-stage-home.js?v=6'),
              ('/site-polish-v3.js?v=4','/site-polish-v3.js?v=6'),
              ('/site-polish-v3.js?v=5','/site-polish-v3.js?v=6'),
              ('stage-home-v4-ultrahd','stage-home-v6-pristine-safe'),
              ('stage-home-v5-clean-ultrahd','stage-home-v6-pristine-safe')
          ]:
              s=s.replace(old,new)
          p.write_text(s)
          PY

      - name: Verify no unrelated site files changed
        run: |
          set -euo pipefail
          git diff --exit-code -- index.html creator-cache-v23.js creator-hd.css safe-ui-bootstrap.js fixed-stage-home.js site-polish-v3.js

      - name: Commit safe UHD stage artwork
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/characters/male/medium/brown/male_textured/*.webp worker.js
          if git diff --cached --quiet; then
            echo 'No stage changes to commit'
            exit 0
          fi
          git commit -m 'Restaurer les paliers nets sans toucher au visage ni aux pieds'
          git pull --rebase origin main
          git push origin HEAD:main
