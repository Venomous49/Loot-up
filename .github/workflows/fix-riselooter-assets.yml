name: Apply RiseLooter static asset patch

# Legacy maintenance workflow. Manual only.
# IMPORTANT: this workflow is allowed to refresh legacy root evolution assets
# and silhouettes, but it must NEVER rewrite index.html or creator routing.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image tools
        run: python3 -m pip install --quiet opencv-python-headless numpy

      - name: Copy character assets to repository root
        run: |
          cp assets/characters/male/medium/brown/male_textured/01-debutant.webp ./01-debutant.webp
          cp assets/characters/male/medium/brown/male_textured/05-debrouillard.webp ./05-debrouillard.webp
          cp assets/characters/male/medium/brown/male_textured/10-chasseur.webp ./10-chasseur.webp
          cp assets/characters/male/medium/brown/male_textured/15-hustler.webp ./15-hustler.webp
          cp assets/characters/male/medium/brown/male_textured/20-pro.webp ./20-pro.webp
          cp assets/characters/male/medium/brown/male_textured/30-elite.webp ./30-elite.webp
          cp assets/characters/male/medium/brown/male_textured/40-cyber-looter.webp ./40-cyber-looter.webp
          cp assets/characters/male/medium/brown/male_textured/50-rise-looter.webp ./50-rise-looter.webp

      - name: Build real silhouette previews
        run: |
          python3 .github/scripts/build_silhouettes.py
          cp silhouettes/01-debutant.png ./sil-01-debutant.png
          cp silhouettes/05-debrouillard.png ./sil-05-debrouillard.png
          cp silhouettes/10-chasseur.png ./sil-10-chasseur.png
          cp silhouettes/15-hustler.png ./sil-15-hustler.png
          cp silhouettes/20-pro.png ./sil-20-pro.png
          cp silhouettes/30-elite.png ./sil-30-elite.png
          cp silhouettes/40-cyber-looter.png ./sil-40-cyber-looter.png
          cp silhouettes/50-rise-looter.png ./sil-50-rise-looter.png

      - name: Verify creator routing is untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- index.html
          test "$(git status --short index.html | wc -l)" -eq 0

      - name: Commit legacy static assets only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- '*.webp' 'sil-*.png' 'silhouettes/*.png'; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.webp' 'sil-*.png' 'silhouettes/*.png'
          git commit -m "Refresh legacy evolution silhouettes"
          git push
