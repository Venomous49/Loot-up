name: Fix RiseLooter asset paths

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix index asset paths
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if '<base href="/">' not in s:
              s = s.replace('<head>\n', '<head>\n<base href="/">\n', 1)

          s = s.replace(
              'return `assets/characters/male/medium/brown/male_textured/${stages[stage].slug}.webp`;',
              'return `/assets/characters/male/medium/brown/male_textured/${stages[stage].slug}.webp`;'
          )
          s = s.replace(
              'return "assets/characters/male/medium/brown/male_textured/01-debutant.webp";',
              'return "/assets/characters/male/medium/brown/male_textured/01-debutant.webp";'
          )
          s = s.replace(
              'return `assets/outfits/${slug}.webp`;',
              'return `/assets/outfits/${slug}.webp`;'
          )

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix if needed
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix RiseLooter asset paths"
          git push
