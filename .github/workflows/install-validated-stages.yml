name: Install final validated evolution stages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-validated-stages.yml'
      - '.stage-assets/final15/**'
      - '.stage-assets/finalb64/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-final-eight-stages
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild the 8 exact approved WebPs
        shell: bash
        run: |
          set -euo pipefail
          cat .stage-assets/final15/01-debutant.part* | tr -d '\r\n' | base64 -d > 01-debutant.webp
          cat .stage-assets/final15/05-debrouillard.part* | tr -d '\r\n' | base64 -d > 05-debrouillard.webp
          cat .stage-assets/final15/10-chasseur.part* | tr -d '\r\n' | base64 -d > 10-chasseur.webp
          cat .stage-assets/final15/15-hustler.part* | tr -d '\r\n' | base64 -d > 15-hustler.webp
          cat .stage-assets/finalb64/20-pro.part* | tr -d '\r\n' | base64 -d > 20-pro.webp
          cat .stage-assets/finalb64/30-elite.part* | tr -d '\r\n' | base64 -d > 30-elite.webp
          cat .stage-assets/finalb64/40-cyber-looter.part* | tr -d '\r\n' | base64 -d > 40-cyber-looter.webp
          cat .stage-assets/finalb64/50-rise-looter.part* | tr -d '\r\n' | base64 -d > 50-rise-looter.webp

      - name: Validate dimensions and exact Git SHAs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib

          expected = {
              '01-debutant.webp':'0eb3dbbed95b72bb768f3bb03863250b3293a196',
              '05-debrouillard.webp':'d7a281dda71541fa7bc99cc122523c13942f9ea9',
              '10-chasseur.webp':'9e7ef24daa1f9229d9a3244b31400e41ceed15f4',
              '15-hustler.webp':'28b15d65472702612d6b06197f7aeda46c22e45f',
              '20-pro.webp':'c5ae33b7035613d133394c7bc10996466a253cfe',
              '30-elite.webp':'91d2eb621bf476b99f7803a5d72dc9728b9a5bc1',
              '40-cyber-looter.webp':'d4563716694cc6b9bd87c0fc296b650b447cf935',
              '50-rise-looter.webp':'5350982c5347d548a9d49e6434085e2a1f417cba',
          }
          lines=[]
          for name, wanted in expected.items():
              data=Path(name).read_bytes()
              got=hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
              if got != wanted:
                  raise SystemExit(f'SHA mismatch {name}: {got} != {wanted}')
              with Image.open(name) as im:
                  im.load()
                  if im.size != (384,512):
                      raise SystemExit(f'Bad dimensions {name}: {im.size}')
              lines.append(f'{name} bytes={len(data)} git_sha={got}')
          Path('stage-assets-final-status.txt').write_text('status=ready\n'+'\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY

      - name: Force fresh browser assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('fixed-stage-home.js')
          s=p.read_text()
          for name in ['01-debutant','05-debrouillard','10-chasseur','15-hustler','20-pro','30-elite','40-cyber-looter','50-rise-looter']:
              s=re.sub(rf"'/{name}\.webp(?:\?v=[^']*)?'", f"'/{name}.webp?v=final-eight-20260821'", s)
          p.write_text(s)
          PY

      - name: Publish the 8 canonical stage files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 01-debutant.webp 05-debrouillard.webp 10-chasseur.webp 15-hustler.webp 20-pro.webp 30-elite.webp 40-cyber-looter.webp 50-rise-looter.webp fixed-stage-home.js stage-assets-final-status.txt
          if git diff --cached --quiet; then
            echo 'Canonical files already match the approved assets.'
            exit 0
          fi
          git commit -m 'Installer les 8 visuels finaux validés'
          git pull --rebase origin main
          git push origin HEAD:main
