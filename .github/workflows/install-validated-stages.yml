name: Install final validated evolution stages

on:
  push:
    branches: [main]
    paths:
      - '.stage-assets/final15/READY'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-final-eight-stages
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild and validate the 8 approved WebPs
        shell: bash
        run: |
          set -euo pipefail
          names=(01-debutant 05-debrouillard 10-chasseur 15-hustler 20-pro 30-elite 40-cyber-looter 50-rise-looter)
          for name in "${names[@]}"; do
            cat ".stage-assets/final15/${name}.part"* | tr -d '\r\n' | base64 -d > "${name}.webp"
          done
          declare -A EXPECTED=(
            [01-debutant]=0eb3dbbed95b72bb768f3bb03863250b3293a196
            [05-debrouillard]=d7a281dda71541fa7bc99cc122523c13942f9ea9
            [10-chasseur]=9e7ef24daa1f9229d9a3244b31400e41ceed15f4
            [15-hustler]=28b15d65472702612d6b06197f7aeda46c22e45f
            [20-pro]=c5ae33b7035613d133394c7bc10996466a253cfe
            [30-elite]=91d2eb621bf476b99f7803a5d72dc9728b9a5bc1
            [40-cyber-looter]=d4563716694cc6b9bd87c0fc296b650b447cf935
            [50-rise-looter]=5350982c5347d548a9d49e6434085e2a1f417cba
          )
          for name in "${names[@]}"; do
            actual="$(git hash-object "${name}.webp")"
            test "$actual" = "${EXPECTED[$name]}" || { echo "SHA mismatch for $name: $actual"; exit 1; }
          done
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          names=['01-debutant','05-debrouillard','10-chasseur','15-hustler','20-pro','30-elite','40-cyber-looter','50-rise-looter']
          for n in names:
              with Image.open(n+'.webp') as im:
                  im.load()
                  assert im.size == (384,512), (n, im.size)
          print('All 8 approved stage images validated')
          PY

      - name: Force fresh browser assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('fixed-stage-home.js')
          s=p.read_text()
          for name in ['01-debutant','05-debrouillard','10-chasseur','15-hustler','20-pro','30-elite','40-cyber-looter','50-rise-looter']:
              s=re.sub(rf"'/{name}\.webp(?:\?v=[^']*)?'", f"'/{name}.webp?v=validated-final-20260821-3'", s)
          p.write_text(s)
          PY

      - name: Publish canonical stage files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 01-debutant.webp 05-debrouillard.webp 10-chasseur.webp 15-hustler.webp 20-pro.webp 30-elite.webp 40-cyber-looter.webp 50-rise-looter.webp fixed-stage-home.js
          git rm -rf .stage-assets .stage-b64 || true
          git rm -f .github/workflows/install-validated-stages.yml || true
          git commit -m 'Installer définitivement les 8 paliers validés'
          git pull --rebase origin main
          git push origin HEAD:main
