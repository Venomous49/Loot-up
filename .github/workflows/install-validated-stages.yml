name: Install validated evolution stage artwork

on:
  push:
    branches: [main]
    paths:
      - '.stage-assets/validated-stages.zip'
      - '.github/workflows/install-validated-stages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-validated-evolution-stages
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace the 8 canonical evolution images
        shell: bash
        run: |
          set -euo pipefail
          test -f .stage-assets/validated-stages.zip
          rm -rf /tmp/validated-stages
          mkdir -p /tmp/validated-stages
          unzip -q .stage-assets/validated-stages.zip -d /tmp/validated-stages
          for f in 01-debutant 05-debrouillard 10-chasseur 15-hustler 20-pro 30-elite 40-cyber-looter 50-rise-looter; do
            test -s "/tmp/validated-stages/$f.webp"
            cp "/tmp/validated-stages/$f.webp" "$f.webp"
          done
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          names=['01-debutant','05-debrouillard','10-chasseur','15-hustler','20-pro','30-elite','40-cyber-looter','50-rise-looter']
          for name in names:
              with Image.open(name+'.webp') as im:
                  if im.size != (384,512):
                      raise SystemExit(f'Unexpected size for {name}: {im.size}')
          print('Validated all 8 canonical stage images')
          PY

      - name: Force a fresh browser asset version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('fixed-stage-home.js')
          s=p.read_text()
          s=s.replace("'/01-debutant.webp'", "'/01-debutant.webp?v=validated-20260821-1'")
          s=s.replace("'/05-debrouillard.webp'", "'/05-debrouillard.webp?v=validated-20260821-1'")
          s=s.replace("'/10-chasseur.webp'", "'/10-chasseur.webp?v=validated-20260821-1'")
          s=s.replace("'/15-hustler.webp'", "'/15-hustler.webp?v=validated-20260821-1'")
          s=s.replace("'/20-pro.webp'", "'/20-pro.webp?v=validated-20260821-1'")
          s=s.replace("'/30-elite.webp'", "'/30-elite.webp?v=validated-20260821-1'")
          s=s.replace("'/40-cyber-looter.webp'", "'/40-cyber-looter.webp?v=validated-20260821-1'")
          s=s.replace("'/50-rise-looter.webp'", "'/50-rise-looter.webp?v=validated-20260821-1'")
          p.write_text(s)
          PY

      - name: Commit the validated 8 stage images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 01-debutant.webp 05-debrouillard.webp 10-chasseur.webp 15-hustler.webp 20-pro.webp 30-elite.webp 40-cyber-looter.webp 50-rise-looter.webp fixed-stage-home.js
          git rm -f .stage-assets/validated-stages.zip .github/workflows/install-validated-stages.yml
          git commit -m 'Remplacer les 8 paliers par les visuels validés'
          git pull --rebase origin main
          git push origin HEAD:main
