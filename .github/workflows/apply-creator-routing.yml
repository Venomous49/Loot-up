name: Apply creator routing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riselooter-creator-routing
  cancel-in-progress: true

jobs:
  routing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate creator routing
        shell: bash
        run: |
          set -euo pipefail
          test "$(find assets/creator/male -type f -name '*.webp' | wc -l)" -eq 125
          test "$(find assets/creator/female -type f -name '*.webp' | wc -l)" -eq 125
          for f in \
            assets/creator/male/medium/brown/male_textured.webp \
            assets/creator/male/light/blond/male_short.webp \
            assets/creator/male/dark/red/male_slick.webp \
            assets/creator/female/medium/brown/female_long.webp \
            assets/creator/female/light/blond/female_bob.webp \
            assets/creator/female/dark/red/female_short.webp; do test -s "$f"; done
          grep -q 'assets/creator/${state.gender}/${state.skin}/${state.hairColor}/${style}.webp?v=${CREATOR_ASSET_VERSION}' index.html
          grep -q 'const thumb = creatorAssetPath(avatarDraft,value)' index.html
          grep -q 'if(field === "gender")' index.html
          test "$(grep -c '^function creatorFallbackPath(gender=avatarDraft.gender){' index.html)" -eq 1
          ! grep -q '01-debutant.webp?v=cleanbase28' index.html
