name: Ultra HD stage assets one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ultrahd-stage-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check opencv-python-headless pillow numpy

      - name: Remove embedded stage titles and upscale x4
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import cv2
          import numpy as np
          from PIL import Image, ImageFilter, ImageEnhance

          base = Path('assets/characters/male/medium/brown/male_textured')
          names = [
              '01-debutant.webp','05-debrouillard.webp','10-chasseur.webp','15-hustler.webp',
              '20-pro.webp','30-elite.webp','40-cyber-looter.webp','50-rise-looter.webp'
          ]

          for name in names:
              path = base / name
              bgr = cv2.imread(str(path), cv2.IMREAD_COLOR)
              if bgr is None:
                  raise SystemExit(f'Cannot read {path}')
              h, w = bgr.shape[:2]

              # The generated stage label is always in the upper-left area.
              # Detect only bright, low-saturation lettering there, then expand
              # the mask enough to include anti-aliased edges and underline strokes.
              hsv = cv2.cvtColor(bgr, cv2.COLOR_BGR2HSV)
              sat = hsv[:,:,1]
              val = hsv[:,:,2]
              roi = np.zeros((h,w), np.uint8)
              roi[int(h*0.045):int(h*0.34), int(w*0.015):int(w*0.70)] = 255
              bright_text = ((val > 155) & (sat < 105)).astype(np.uint8) * 255
              mask = cv2.bitwise_and(bright_text, roi)

              # Keep text-like connected components and long underline strokes.
              n, labels, stats, _ = cv2.connectedComponentsWithStats(mask, 8)
              clean = np.zeros_like(mask)
              for i in range(1, n):
                  x,y,cw,ch,area = stats[i]
                  if area >= max(5, int(w*h*0.000025)) and (cw >= 3 or ch >= 3):
                      clean[labels == i] = 255
              kernel = cv2.getStructuringElement(cv2.MORPH_ELLIPSE, (7,7))
              clean = cv2.dilate(clean, kernel, iterations=2)

              # Inpaint at source resolution to reconstruct wall/alley texture naturally.
              repaired = cv2.inpaint(bgr, clean, 5, cv2.INPAINT_TELEA)
              rgb = cv2.cvtColor(repaired, cv2.COLOR_BGR2RGB)
              img = Image.fromarray(rgb)

              # x4 high-quality upscale. This increases delivery resolution while
              # preserving composition; mild sharpening/contrast avoids a soft result.
              target = (w*4, h*4)
              img = img.resize(target, Image.Resampling.LANCZOS)
              img = img.filter(ImageFilter.UnsharpMask(radius=1.6, percent=125, threshold=3))
              img = ImageEnhance.Sharpness(img).enhance(1.08)
              img = ImageEnhance.Contrast(img).enhance(1.025)
              img.save(path, 'WEBP', quality=96, method=6)
              print(f'{name}: {w}x{h} -> {target[0]}x{target[1]}')
          PY

      - name: Bump asset cache version and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('worker.js')
          s = p.read_text()
          s = s.replace('/fixed-stage-home.js?v=2', '/fixed-stage-home.js?v=4')
          s = s.replace('/site-polish-v3.js?v=3', '/site-polish-v3.js?v=4')
          s = s.replace('fixed-gender-v1-stage-home-v2-polish-v3-right-position', 'fixed-gender-v1-stage-home-v4-ultrahd')
          s = s.replace('safe-bootstrap-fixed-gender-v1-stage-home-v2-polish-v3-right-position', 'safe-bootstrap-fixed-gender-v1-stage-home-v4-ultrahd')
          p.write_text(s)
          PY
          rm -f .github/workflows/ultrahd-stage-assets.yml

      - name: Commit processed assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/characters/male/medium/brown/male_textured/*.webp worker.js .github/workflows/ultrahd-stage-assets.yml
          git commit -m 'Nettoyer et convertir les 8 paliers en Ultra HD'
          git pull --rebase origin main
          git push origin HEAD:main
