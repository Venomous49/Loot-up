name: One-shot source fallback repair

on:
  push:
    paths:
      - '.github/workflows/one-shot-source-fallback-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch source-owned creator fallbacks
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '''function creatorFallbackPath(gender=avatarDraft.gender){
            const style = gender === "female" ? "female_long" : "male_textured";
            return creatorAssetPath({gender,skin:"medium",hairColor:"brown",hairStyle:style});
          }'''
          new = '''function creatorFallbackPath(gender=avatarDraft.gender,skin=avatarDraft.skin,hairColor=avatarDraft.hairColor){
            const style = gender === "female" ? "female_long" : "male_textured";
            return creatorAssetPath({gender,skin,hairColor,hairStyle:style});
          }'''
          if old not in s:
              raise SystemExit('creatorFallbackPath legacy source block not found exactly once')
          if s.count(old) != 1:
              raise SystemExit(f'creatorFallbackPath legacy source block found {s.count(old)} times')
          s = s.replace(old, new, 1)

          old = '''const fallback=stage===0
            ? creatorFallbackPath(gender)
            : fallbackAssetPath(stage);'''
          new = '''const fallback=stage===0
            ? creatorFallbackPath(gender, profile?.avatar_skin || "medium", profile?.avatar_hair_color || "brown")
            : fallbackAssetPath(stage);'''
          if old not in s or s.count(old) != 1:
              raise SystemExit('characterHTML fallback block not found exactly once')
          s = s.replace(old, new, 1)

          old = "onload=\"document.getElementById('saveAvatar').disabled=false\""
          new = "onload=\"document.getElementById('saveAvatar').disabled=this.dataset.triedFallback==='1'\""
          if old not in s or s.count(old) != 1:
              raise SystemExit('creator preview onload block not found exactly once')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Validate complete creator library
        run: |
          python -m pip install --quiet 'numpy<3' opencv-python-headless
          python scripts/validate_creator_library.py

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static site
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/loot-up-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/loot-up-http.log
          exit 1

      - name: Exercise creator in Chromium
        run: node scripts/creator_runtime_smoke.mjs

      - name: Publish verified repair and remove one-shot runner
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-source-fallback-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Harden creator fallbacks in source"
          git push origin HEAD:main
