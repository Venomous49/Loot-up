name: Enhance character assets HD

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enhance-character-assets.yml'

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Rebuild all canonical character assets at display-safe HD resolution
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageFilter
          from pathlib import Path

          names = [
            '01-debutant.webp','05-debrouillard.webp','10-chasseur.webp','15-hustler.webp',
            '20-pro.webp','30-elite.webp','40-cyber-looter.webp','50-rise-looter.webp',
            'female-01-debutant.webp','female-05-debrouillard.webp','female-10-chasseur.webp','female-15-hustler.webp',
            'female-20-pro.webp','female-30-elite.webp','female-40-cyber-looter.webp','female-50-rise-looter.webp'
          ]

          target_long = 1536
          for name in names:
              p = Path(name)
              if not p.exists():
                  print('missing', name)
                  continue
              im = Image.open(p).convert('RGB')
              w, h = im.size
              long_side = max(w, h)
              if long_side < target_long:
                  scale = target_long / long_side
                  nw, nh = round(w * scale), round(h * scale)
                  im = im.resize((nw, nh), Image.Resampling.LANCZOS)
              # Mild detail recovery only; do not alter character design/colors/composition.
              im = im.filter(ImageFilter.UnsharpMask(radius=0.7, percent=70, threshold=2))
              im.save(p, 'WEBP', quality=96, method=6)
              print(name, (w,h), '->', im.size)
          PY
      - name: Commit HD assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.webp'
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild all male and female stage assets in HD'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
