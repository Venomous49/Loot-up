name: Apply creator test mode
on:
  push:
    paths:
      - 'scripts/enable_creator_test.py'
      - '.github/workflows/apply-creator-test.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enable creator test mode
        run: python scripts/enable_creator_test.py
      - name: Commit test mode
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable character creator test mode"
          git push
