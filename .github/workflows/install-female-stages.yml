name: Install validated female evolution stages

on:
  push:
    branches: [integrate-female-stages]
    paths:
      - '.stage-female/READY'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-female-eight-stages
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate-female-stages
          fetch-depth: 0

      - name: Rebuild and validate 8 female WebPs
        shell: bash
        run: |
          set -euo pipefail
          names=(01-debutant-female 05-debrouillard-female 10-chasseur-female 15-hustler-female 20-pro-female 30-elite-female 40-cyber-looter-female 50-rise-looter-female)
          for name in "${names[@]}"; do
            cat ".stage-female/${name}.part"* | tr -d '\r\n' | base64 -d > "${name}.webp"
          done
          declare -A EXPECTED=(
            [01-debutant-female]=30cbb071cce03746b0ce6e00e4c095182f5c5c48
            [05-debrouillard-female]=da6a30e5591cedbe63f2f0183c7151ebf777ba15
            [10-chasseur-female]=670fa31fc16f386f3a92b2226140b7362221f844
            [15-hustler-female]=b9a6ef20c361fb6e0230cd17eceac9575ddb83b4
            [20-pro-female]=a5e3104db54e8d1e8cf8e5a52b2c37120212cd8b
            [30-elite-female]=93c2a7fe5a7b91d3ddfcaceda2ae18940ed1dde4
            [40-cyber-looter-female]=9a7cf18a3f05c41dad9a8c13ed6a05a68c80d491
            [50-rise-looter-female]=2cef1fa64b299fe53870eea9d7773eddc166e96a
          )
          python3 -m pip install --quiet pillow
          for name in "${names[@]}"; do
            actual="$(git hash-object "${name}.webp")"
            test "$actual" = "${EXPECTED[$name]}" || { echo "SHA mismatch for $name: $actual"; exit 1; }
          done
          python3 - <<'PY'
          from PIL import Image
          names=['01-debutant-female','05-debrouillard-female','10-chasseur-female','15-hustler-female','20-pro-female','30-elite-female','40-cyber-looter-female','50-rise-looter-female']
          for n in names:
              with Image.open(n+'.webp') as im:
                  im.load()
                  assert im.size == (384,512), (n, im.size)
          print('All 8 female stage images validated')
          PY

      - name: Enable male/female stage selection with identical rendering
        shell: bash
        run: |
          cat > fixed-stage-home.js <<'JS'
          (() => {
            'use strict';

            const MALE_STAGE_ASSETS = [
              '/01-debutant.webp?v=gender-stages-20260821',
              '/05-debrouillard.webp?v=gender-stages-20260821',
              '/10-chasseur.webp?v=gender-stages-20260821',
              '/15-hustler.webp?v=gender-stages-20260821',
              '/20-pro.webp?v=gender-stages-20260821',
              '/30-elite.webp?v=gender-stages-20260821',
              '/40-cyber-looter.webp?v=gender-stages-20260821',
              '/50-rise-looter.webp?v=gender-stages-20260821'
            ];
            const FEMALE_STAGE_ASSETS = [
              '/01-debutant-female.webp?v=gender-stages-20260821',
              '/05-debrouillard-female.webp?v=gender-stages-20260821',
              '/10-chasseur-female.webp?v=gender-stages-20260821',
              '/15-hustler-female.webp?v=gender-stages-20260821',
              '/20-pro-female.webp?v=gender-stages-20260821',
              '/30-elite-female.webp?v=gender-stages-20260821',
              '/40-cyber-looter-female.webp?v=gender-stages-20260821',
              '/50-rise-looter-female.webp?v=gender-stages-20260821'
            ];

            function isFemaleProfile(profile) {
              const candidates = [
                profile?.gender,
                profile?.sex,
                profile?.sexe,
                profile?.characterGender,
                profile?.character_gender,
                profile?.avatarGender,
                profile?.avatar_gender,
                profile?.character?.gender,
                profile?.avatar?.gender
              ].filter(v => v != null).map(v => String(v).trim().toLowerCase());
              return candidates.some(v => ['female','femme','woman','f','2'].includes(v));
            }

            const originalAssetPath = window.assetPath;
            if (typeof originalAssetPath === 'function') {
              window.assetPath = function(profile, stage) {
                const index = Math.max(0, Math.min(Number(stage) || 0, MALE_STAGE_ASSETS.length - 1));
                return (isFemaleProfile(profile) ? FEMALE_STAGE_ASSETS : MALE_STAGE_ASSETS)[index];
              };
            }

            const ALL_STAGE_ASSETS = [...MALE_STAGE_ASSETS, ...FEMALE_STAGE_ASSETS];
            const style = document.createElement('style');
            style.id = 'fixed-stage-home-art-style';
            style.textContent = `
              #home .hero .scene-clean-image.stage-art-clean,
              .evolution-real.stage-art-clean {
                width: 100% !important;
                height: 100% !important;
                max-width: 100% !important;
                object-fit: contain !important;
                object-position: center center !important;
                transform: none !important;
                filter: none !important;
                opacity: 1 !important;
                padding: 0 !important;
                box-sizing: border-box !important;
                image-rendering: auto !important;
              }
            `;
            document.head.appendChild(style);

            function markStageArtwork(root = document) {
              root.querySelectorAll?.('img').forEach(img => {
                const src = img.getAttribute('src') || img.currentSrc || '';
                if (ALL_STAGE_ASSETS.some(asset => src.includes(asset.split('?')[0]))) img.classList.add('stage-art-clean');
              });
            }

            markStageArtwork();
            new MutationObserver(() => markStageArtwork()).observe(document.documentElement, {
              childList: true,
              subtree: true,
              attributes: true,
              attributeFilter: ['src']
            });
          })();
          JS

      - name: Publish female assets on integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add *-female.webp fixed-stage-home.js
          git commit -m 'Installer les 8 évolutions féminines validées'
          git pull --rebase origin integrate-female-stages
          git push origin HEAD:integrate-female-stages
