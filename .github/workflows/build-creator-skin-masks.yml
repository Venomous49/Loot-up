name: Build creator skin masks

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/build_creator_skin_masks.py'
      - 'assets/creator_sources/fullbody/male_base.png'
      - 'assets/creator_sources/fullbody/female_base.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install opencv-python-headless numpy
      - run: python .github/scripts/build_creator_skin_masks.py
      - name: Commit generated skin masks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/creator_sources/fullbody/male_skin_mask.png assets/creator_sources/fullbody/female_skin_mask.png
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'Generate creator skin masks'
            git push
          fi
