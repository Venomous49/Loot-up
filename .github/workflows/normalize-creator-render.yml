name: Normalize creator render

on:
  push:
    paths:
      - '.github/workflows/normalize-creator-render.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize character creator rendering
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* RISE_LOOTER_CREATOR_HD_NORMALIZATION_V1 */'
          css = r'''
/* RISE_LOOTER_CREATOR_HD_NORMALIZATION_V1 */
#creatorModal .creator-preview{
  position:relative!important;
  overflow:hidden!important;
  background:#03080d!important;
  aspect-ratio:16/9!important;
}
#creatorModal .creator-preview .creator-real-preview,
#creatorModal .creator-preview img{
  position:absolute!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  max-width:none!important;
  object-fit:contain!important;
  object-position:50% 100%!important;
  image-rendering:auto!important;
  filter:none!important;
  opacity:1!important;
  transform:none!important;
  animation:none!important;
  backface-visibility:hidden!important;
  -webkit-font-smoothing:antialiased!important;
}
#creatorModal .creator-preview .creator-real-preview{
  scale:1!important;
}
#creatorModal .creator-preview::before,
#creatorModal .creator-preview::after{
  content:none!important;
  display:none!important;
}
#creatorModal .creator-skin-overlay,
#creatorModal .creator-hair-overlay,
#creatorModal .creator-body-overlay,
#creatorModal .creator-face-overlay{
  display:none!important;
  visibility:hidden!important;
  opacity:0!important;
}
#creatorModal .creator-live{
  min-width:0!important;
}
#creatorModal .hair-thumb{
  image-rendering:auto!important;
  filter:none!important;
  transform:none!important;
  background-size:cover!important;
  background-position:50% 18%!important;
}
#creatorModal .creator-preview[data-gender="male"] img,
#creatorModal .creator-preview[data-gender="female"] img{
  object-position:50% 100%!important;
}
/* Keep every preset in one fixed viewport so body scale and placement stay stable. */
#creatorModal .creator-preview{
  contain:layout paint!important;
}
/* Do not alter the baked street background in creator assets. */
#creatorModal .creator-preview img{
  mix-blend-mode:normal!important;
}
'''
          if marker not in s:
              s = s.replace('</style>', css + '\n</style>', 1)
          # Add a small runtime normalizer that applies equally to every male/female preset.
          js_marker = '/* RISE_LOOTER_CREATOR_RUNTIME_NORMALIZATION_V1 */'
          js = r'''
/* RISE_LOOTER_CREATOR_RUNTIME_NORMALIZATION_V1 */
(function(){
  function normalizeCreatorPreview(){
    const preview = document.getElementById('creatorPreview');
    if(!preview) return;
    const selectedGender = document.querySelector('#genderChoices .choice.selected');
    const gender = selectedGender?.dataset?.value || 'male';
    preview.dataset.gender = gender;
    const imgs = preview.querySelectorAll('img');
    imgs.forEach(img=>{
      img.decoding = 'async';
      img.loading = 'eager';
      img.style.objectFit = 'contain';
      img.style.objectPosition = '50% 100%';
      img.style.width = '100%';
      img.style.height = '100%';
      img.style.filter = 'none';
      img.style.transform = 'none';
      img.style.opacity = '1';
    });
  }
  const observer = new MutationObserver(normalizeCreatorPreview);
  window.addEventListener('DOMContentLoaded', ()=>{
    const preview = document.getElementById('creatorPreview');
    if(preview) observer.observe(preview,{childList:true,subtree:true,attributes:true,attributeFilter:['src','class']});
    document.getElementById('genderChoices')?.addEventListener('click',()=>requestAnimationFrame(normalizeCreatorPreview));
    document.getElementById('skinChoices')?.addEventListener('click',()=>requestAnimationFrame(normalizeCreatorPreview));
    document.getElementById('hairColorChoices')?.addEventListener('click',()=>requestAnimationFrame(normalizeCreatorPreview));
    document.getElementById('hairStyleChoices')?.addEventListener('click',()=>requestAnimationFrame(normalizeCreatorPreview));
    normalizeCreatorPreview();
  });
})();
'''
          if js_marker not in s:
              s = s.replace('</script>', js + '\n</script>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit normalized creator rendering
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Normalize full-body HD creator rendering"
          git push
