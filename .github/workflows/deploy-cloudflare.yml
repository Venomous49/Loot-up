name: Deploy RiseLooter to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'wrangler.jsonc'
      - 'creator-cache-v23.js'
      - 'creator-hd.css'
      - 'index.html'
      - 'safe-ui-bootstrap.js'
      - 'assets/creator/**'
      - 'assets/creator_layers/**'
      - 'creator-layered-build-status.txt'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_run:
    workflows: ['Creator layered HD build']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: riselooter-cloudflare-production-v4
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refuse stale creator presets
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^status=success$' creator-layered-build-status.txt
          grep -q '^generator=layered-v4-clean-source$' creator-layered-build-status.txt
          test -f assets/creator_layers/manifest.txt
          grep -q '^creator_version=layered-v4-clean-source$' assets/creator_layers/manifest.txt
          test -s assets/creator_sources/fullbody/male_base_clean.png
          test "$(find assets/creator_layers/male -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 31
          test "$(find assets/creator_layers/female -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 31
      - name: Verify Cloudflare user token
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify > /tmp/userverify.json
          python3 -c "import json,sys; d=json.load(open('/tmp/userverify.json')); sys.exit(0 if d.get('success') else 1)"
      - name: Deploy Worker and static assets
        id: deploy
        shell: bash
        run: |
          set +e
          npx --yes wrangler@4 deploy > /tmp/wrangler-deploy.log 2>&1
          code=$?
          set -e
          sed -E 's/(cfut_|cfat_)[A-Za-z0-9_-]+/[REDACTED_TOKEN]/g' /tmp/wrangler-deploy.log | tail -n 120 > cloudflare-deploy-log.txt
          if [ "$code" -eq 0 ]; then echo 'outcome=success' >> "$GITHUB_OUTPUT"; else echo 'outcome=failure' >> "$GITHUB_OUTPUT"; fi
          exit 0
      - name: Record Cloudflare deployment result
        if: always()
        env:
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'status=%s\nsource_commit=%s\ncreator_version=layered-v4-clean-source\nasset_cache=layered-v4-clean-source\napi_token_present=%s\naccount_id_source=wrangler-config\n' '${{ steps.deploy.outputs.outcome }}' "$(git rev-parse HEAD)" "$HAS_CF_TOKEN" > cloudflare-deploy-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-deploy-status.txt cloudflare-deploy-log.txt
          git diff --cached --quiet || (git commit -m 'Record Cloudflare deployment diagnostics' && git push origin HEAD:main)
      - name: Fail when deployment failed
        if: steps.deploy.outputs.outcome != 'success'
        run: exit 1
