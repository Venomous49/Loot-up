name: Deploy RiseLooter to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'wrangler.jsonc'
      - 'creator-cache-v23.js'
      - 'creator-hd.css'
      - 'index.html'
      - 'safe-ui-bootstrap.js'
      - 'assets/creator/**'
      - 'assets/characters/**'
      - 'creator-production-build-status.txt'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: riselooter-cloudflare-production-v5
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate production creator assets
        shell: bash
        run: |
          set -euo pipefail
          test -f creator-production-build-status.txt
          grep -q '^male_full_body_locked=yes$' creator-production-build-status.txt
          grep -q '^male_hair_never_below_head=yes$' creator-production-build-status.txt
          test "$(find assets/creator/male -type f -name '*.webp' | wc -l)" -eq 125
          test "$(find assets/creator/female -type f -name '*.webp' | wc -l)" -eq 125
      - name: Verify Cloudflare user token
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify > /tmp/userverify.json
          python3 -c "import json,sys; d=json.load(open('/tmp/userverify.json')); sys.exit(0 if d.get('success') else 1)"
      - name: Deploy Worker and static assets
        id: deploy
        shell: bash
        run: |
          set +e
          npx --yes wrangler@4 deploy > /tmp/wrangler-deploy.log 2>&1
          code=$?
          set -e
          sed -E 's/(cfut_|cfat_)[A-Za-z0-9_-]+/[REDACTED_TOKEN]/g' /tmp/wrangler-deploy.log | tail -n 120 > cloudflare-deploy-log.txt
          if [ "$code" -eq 0 ]; then echo 'outcome=success' >> "$GITHUB_OUTPUT"; else echo 'outcome=failure' >> "$GITHUB_OUTPUT"; fi
          exit 0
      - name: Record Cloudflare deployment result
        if: always()
        env:
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'status=%s\nsource_commit=%s\ncreator_version=production-fixed-body\napi_token_present=%s\n' '${{ steps.deploy.outputs.outcome }}' "$(git rev-parse HEAD)" "$HAS_CF_TOKEN" > cloudflare-deploy-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-deploy-status.txt cloudflare-deploy-log.txt
          git diff --cached --quiet || (git commit -m 'Record Cloudflare deployment diagnostics' && git pull --rebase origin main && git push origin HEAD:main)
      - name: Fail when deployment failed
        if: steps.deploy.outputs.outcome != 'success'
        run: exit 1
