name: Deploy RiseLooter to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'wrangler.jsonc'
      - 'creator-cache-v23.js'
      - 'creator-hd.css'
      - 'index.html'
      - 'safe-ui-bootstrap.js'
      - 'fixed-stage-home.js'
      - 'site-polish-v3.js'
      - '01-debutant.webp'
      - '05-debrouillard.webp'
      - '10-chasseur.webp'
      - '15-hustler.webp'
      - '20-pro.webp'
      - '30-elite.webp'
      - '40-cyber-looter.webp'
      - '50-rise-looter.webp'
      - '.stage-assets/validated-stages.zip'
      - '.stage-assets/01-debutant.webp'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: riselooter-cloudflare-production-v9
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Inspect and recover validated stage payload
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .stage-assets/validated-stages.zip ]; then
            python3 -m pip install --quiet pillow
            python3 - <<'PY'
            from pathlib import Path
            from PIL import Image
            import io
            data=Path('.stage-assets/validated-stages.zip').read_bytes()
            riffs=[]; webps=[]; valid=[]; pos=0
            while True:
                i=data.find(b'RIFF',pos)
                if i<0: break
                riffs.append(i)
                if i+12<=len(data) and data[i+8:i+12]==b'WEBP':
                    size=int.from_bytes(data[i+4:i+8],'little')+8
                    chunk=data[i:i+size]
                    if len(chunk)==size:
                        webps.append((i,size,chunk))
                        try:
                            with Image.open(io.BytesIO(chunk)) as im:
                                im.load()
                                valid.append((i,size,im.size))
                        except Exception:
                            pass
                pos=i+4
            Path('stage-recovery-status.txt').write_text(
                f'data_bytes={len(data)}\nriff_count={len(riffs)}\nwebp_structural_count={len(webps)}\nvalid_image_count={len(valid)}\nvalid={[(i,s,sz) for i,s,sz in valid]}\n'
            )
            PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add stage-recovery-status.txt
            git diff --cached --quiet || (git commit -m 'Record stage recovery diagnostics' && git pull --rebase origin main && git push origin HEAD:main)
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate the 8 canonical evolution images
        shell: bash
        run: |
          set -euo pipefail
          for f in 01-debutant.webp 05-debrouillard.webp 10-chasseur.webp 15-hustler.webp 20-pro.webp 30-elite.webp 40-cyber-looter.webp 50-rise-looter.webp; do test -s "$f"; done

      - name: Verify Cloudflare user token
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify > /tmp/userverify.json
          python3 -c "import json,sys; d=json.load(open('/tmp/userverify.json')); sys.exit(0 if d.get('success') else 1)"

      - name: Deploy Worker and static assets
        id: deploy
        shell: bash
        run: |
          set +e
          npx --yes wrangler@4 deploy > /tmp/wrangler-deploy.log 2>&1
          code=$?
          set -e
          sed -E 's/(cfut_|cfat_)[A-Za-z0-9_-]+/[REDACTED_TOKEN]/g' /tmp/wrangler-deploy.log | tail -n 120 > cloudflare-deploy-log.txt
          if [ "$code" -eq 0 ]; then echo 'outcome=success' >> "$GITHUB_OUTPUT"; else echo 'outcome=failure' >> "$GITHUB_OUTPUT"; fi
          exit 0

      - name: Record Cloudflare deployment result
        if: always()
        env:
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'status=%s\nsource_commit=%s\nstage_version=validated-eight-canonical-images\napi_token_present=%s\n' '${{ steps.deploy.outputs.outcome }}' "$(git rev-parse HEAD)" "$HAS_CF_TOKEN" > cloudflare-deploy-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-deploy-status.txt cloudflare-deploy-log.txt
          git diff --cached --quiet || (git commit -m 'Record Cloudflare deployment diagnostics' && git pull --rebase origin main && git push origin HEAD:main)

      - name: Fail when deployment failed
        if: steps.deploy.outputs.outcome != 'success'
        run: exit 1
