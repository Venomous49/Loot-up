name: Deploy RiseLooter to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'wrangler.jsonc'
      - 'index.html'
      - 'fixed-stage-home.js'
      - 'site-polish-v3.js'
      - '01-debutant.webp'
      - '05-debrouillard.webp'
      - '10-chasseur.webp'
      - '15-hustler.webp'
      - '20-pro.webp'
      - '30-elite.webp'
      - '40-cyber-looter.webp'
      - '50-rise-looter.webp'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: riselooter-cloudflare-production-final
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify exact 8 canonical stage files
        shell: bash
        run: |
          set -euo pipefail
          declare -A EXPECTED=(
            [01-debutant.webp]=0eb3dbbed95b72bb768f3bb03863250b3293a196
            [05-debrouillard.webp]=d7a281dda71541fa7bc99cc122523c13942f9ea9
            [10-chasseur.webp]=9e7ef24daa1f9229d9a3244b31400e41ceed15f4
            [15-hustler.webp]=28b15d65472702612d6b06197f7aeda46c22e45f
            [20-pro.webp]=c5ae33b7035613d133394c7bc10996466a253cfe
            [30-elite.webp]=91d2eb621bf476b99f7803a5d72dc9728b9a5bc1
            [40-cyber-looter.webp]=d4563716694cc6b9bd87c0fc296b650b447cf935
            [50-rise-looter.webp]=5350982c5347d548a9d49e6434085e2a1f417cba
          )
          for f in "${!EXPECTED[@]}"; do
            test -s "$f"
            actual="$(git hash-object "$f")"
            test "$actual" = "${EXPECTED[$f]}" || { echo "SHA mismatch for $f: $actual"; exit 1; }
          done

      - name: Verify Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify > /tmp/userverify.json
          python3 -c "import json,sys; d=json.load(open('/tmp/userverify.json')); sys.exit(0 if d.get('success') else 1)"

      - name: Deploy Worker and static assets
        id: deploy
        shell: bash
        run: |
          set +e
          npx --yes wrangler@4 deploy > /tmp/wrangler-deploy.log 2>&1
          code=$?
          set -e
          sed -E 's/(cfut_|cfat_)[A-Za-z0-9_-]+/[REDACTED_TOKEN]/g' /tmp/wrangler-deploy.log | tail -n 120 > cloudflare-deploy-log.txt
          if [ "$code" -eq 0 ]; then
            echo 'outcome=success' >> "$GITHUB_OUTPUT"
          else
            echo 'outcome=failure' >> "$GITHUB_OUTPUT"
          fi

      - name: Record Cloudflare result
        if: always()
        env:
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          outcome='${{ steps.deploy.outputs.outcome }}'
          [ -n "$outcome" ] || outcome='failure'
          printf 'status=%s\nsource_commit=%s\nstage_version=validated-final-eight\napi_token_present=%s\n' "$outcome" "$(git rev-parse HEAD)" "$HAS_CF_TOKEN" > cloudflare-deploy-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-deploy-status.txt cloudflare-deploy-log.txt
          git diff --cached --quiet || (git commit -m 'Record Cloudflare deployment diagnostics' && git pull --rebase origin main && git push origin HEAD:main)

      - name: Fail on deployment failure
        if: steps.deploy.outputs.outcome != 'success'
        run: exit 1
