name: Deploy RiseLooter to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'wrangler.jsonc'
      - 'index.html'
      - 'fixed-stage-home.js'
      - 'safe-ui-bootstrap.js'
      - 'site-polish-v3.js'
      - 'evolution-test-mode.js'
      - '.asset-enhance-all'
      - '01-debutant.webp'
      - '05-debrouillard.webp'
      - '10-chasseur.webp'
      - '15-hustler.webp'
      - '20-pro.webp'
      - '30-elite.webp'
      - '40-cyber-looter.webp'
      - '50-rise-looter.webp'
      - 'female-01-debutant.webp'
      - 'female-05-debrouillard.webp'
      - 'female-10-chasseur.webp'
      - 'female-15-hustler.webp'
      - 'female-20-pro.webp'
      - 'female-30-elite.webp'
      - 'female-40-cyber-looter.webp'
      - 'female-50-rise-looter.webp'
      - '.github/workflows/deploy-cloudflare.yml'
  pull_request:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: riselooter-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.title == 'Trigger all 16 assets 4K production run'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify all 16 canonical character assets
        shell: bash
        run: |
          set -euo pipefail
          files=(01-debutant.webp 05-debrouillard.webp 10-chasseur.webp 15-hustler.webp 20-pro.webp 30-elite.webp 40-cyber-looter.webp 50-rise-looter.webp female-01-debutant.webp female-05-debrouillard.webp female-10-chasseur.webp female-15-hustler.webp female-20-pro.webp female-30-elite.webp female-40-cyber-looter.webp female-50-rise-looter.webp)
          for f in "${files[@]}"; do test -s "$f" || { echo "Missing asset: $f"; exit 1; }; done

      - name: Detect one-time enhancement request
        id: enhance
        shell: bash
        run: |
          if [ -f .asset-enhance-all ]; then echo 'run=true' >> "$GITHUB_OUTPUT"; else echo 'run=false' >> "$GITHUB_OUTPUT"; fi

      - name: Install image restoration dependencies
        if: steps.enhance.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers webp
          wget -q https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip -O /tmp/realesrgan.zip
          unzip -q /tmp/realesrgan.zip -d /tmp/realesrgan
          chmod +x /tmp/realesrgan/realesrgan-ncnn-vulkan

      - name: Enhance all 16 current character masters in place
        if: steps.enhance.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/riselooter4k
          files=(01-debutant.webp 05-debrouillard.webp 10-chasseur.webp 15-hustler.webp 20-pro.webp 30-elite.webp 40-cyber-looter.webp 50-rise-looter.webp female-01-debutant.webp female-05-debrouillard.webp female-10-chasseur.webp female-15-hustler.webp female-20-pro.webp female-30-elite.webp female-40-cyber-looter.webp female-50-rise-looter.webp)
          for f in "${files[@]}"; do
            base="${f%.webp}"
            dwebp "$f" -o "/tmp/${base}.png" >/dev/null
            /tmp/realesrgan/realesrgan-ncnn-vulkan -i "/tmp/${base}.png" -o "/tmp/riselooter4k/${base}.png" -n realesrgan-x4plus -s 4 -f png
            cwebp -quiet -q 100 -m 6 -sharp_yuv "/tmp/riselooter4k/${base}.png" -o "$f"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .asset-enhance-all
          git add 01-debutant.webp 05-debrouillard.webp 10-chasseur.webp 15-hustler.webp 20-pro.webp 30-elite.webp 40-cyber-looter.webp 50-rise-looter.webp female-01-debutant.webp female-05-debrouillard.webp female-10-chasseur.webp female-15-hustler.webp female-20-pro.webp female-30-elite.webp female-40-cyber-looter.webp female-50-rise-looter.webp .asset-enhance-all
          git commit -m 'Enhance all 16 character masters to 4K [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify > /tmp/userverify.json
          node -e "const d=require('/tmp/userverify.json'); process.exit(d.success?0:1)"

      - name: Deploy current workspace to Cloudflare
        id: deploy
        shell: bash
        run: |
          set +e
          npx --yes wrangler@4 deploy > /tmp/wrangler-deploy.log 2>&1
          code=$?
          set -e
          sed -E 's/(cfut_|cfat_)[A-Za-z0-9_-]+/[REDACTED_TOKEN]/g' /tmp/wrangler-deploy.log | tail -n 160 > cloudflare-deploy-log.txt
          if [ "$code" -eq 0 ]; then echo 'outcome=success' >> "$GITHUB_OUTPUT"; else echo 'outcome=failure' >> "$GITHUB_OUTPUT"; fi

      - name: Record Cloudflare result
        if: always()
        env:
          TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          outcome='${{ steps.deploy.outputs.outcome }}'; [ -n "$outcome" ] || outcome='failure'
          printf 'status=%s\nsource_commit=%s\nstage_version=all-assets-4k-v1\ncharacter_assets=16\nrollback_source=disabled\n' "$outcome" "$TRIGGER_SHA" > cloudflare-deploy-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-deploy-status.txt cloudflare-deploy-log.txt
          git diff --cached --quiet || (git commit -m 'Record Cloudflare deployment diagnostics [skip ci]' && git pull --rebase origin main && git push origin HEAD:main)

      - name: Fail on deployment failure
        if: steps.deploy.outputs.outcome != 'success'
        run: exit 1
