name: Deploy RiseLooter to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'wrangler.jsonc'
      - 'creator-cache-v23.js'
      - 'creator-hd.css'
      - 'index.html'
      - 'safe-ui-bootstrap.js'
      - 'fixed-stage-home.js'
      - 'site-polish-v3.js'
      - '01-debutant.webp'
      - '05-debrouillard.webp'
      - '10-chasseur.webp'
      - '15-hustler.webp'
      - '20-pro.webp'
      - '30-elite.webp'
      - '40-cyber-looter.webp'
      - '50-rise-looter.webp'
      - '.stage-assets/validated-stages.zip'
      - '.stage-assets/01-debutant.webp'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: riselooter-cloudflare-production-v8
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Recover and publish the exact 8 validated evolution images
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .stage-assets/validated-stages.zip ] && [ -f .stage-assets/01-debutant.webp ]; then
            cp .stage-assets/01-debutant.webp 01-debutant.webp
            python3 -m pip install --quiet pillow
            python3 - <<'PY'
            from pathlib import Path
            from PIL import Image
            import io, re

            data=Path('.stage-assets/validated-stages.zip').read_bytes()
            recovered=[]
            pos=0
            while True:
                i=data.find(b'RIFF',pos)
                if i<0: break
                if i+12<=len(data) and data[i+8:i+12]==b'WEBP':
                    size=int.from_bytes(data[i+4:i+8],'little')+8
                    chunk=data[i:i+size]
                    if len(chunk)==size:
                        try:
                            with Image.open(io.BytesIO(chunk)) as im:
                                im.load()
                                if im.size==(384,512): recovered.append(chunk)
                        except Exception:
                            pass
                pos=i+4

            if len(recovered) < 7:
                raise SystemExit(f'Only {len(recovered)} recoverable validated WebPs found')
            recovered=recovered[-7:]
            names=['05-debrouillard','10-chasseur','15-hustler','20-pro','30-elite','40-cyber-looter','50-rise-looter']
            for name,chunk in zip(names,recovered):
                Path(name+'.webp').write_bytes(chunk)

            all_names=['01-debutant']+names
            for name in all_names:
                with Image.open(name+'.webp') as im:
                    im.load()
                    if im.size!=(384,512): raise SystemExit(f'Unexpected size for {name}: {im.size}')

            p=Path('fixed-stage-home.js')
            s=p.read_text()
            for name in all_names:
                s=re.sub(rf"'/{name}\.webp(?:\?v=[^']*)?'", f"'/{name}.webp?v=validated-final-20260821'", s)
            p.write_text(s)
            print('All 8 approved stage images recovered and validated')
            PY

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add 01-debutant.webp 05-debrouillard.webp 10-chasseur.webp 15-hustler.webp 20-pro.webp 30-elite.webp 40-cyber-looter.webp 50-rise-looter.webp fixed-stage-home.js
            git rm -f .stage-assets/validated-stages.zip .stage-assets/01-debutant.webp || true
            git rm -f .github/workflows/install-validated-stages.yml || true
            git commit -m 'Remplacer définitivement les 8 paliers par les visuels validés'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate the 8 canonical evolution images
        shell: bash
        run: |
          set -euo pipefail
          for f in 01-debutant.webp 05-debrouillard.webp 10-chasseur.webp 15-hustler.webp 20-pro.webp 30-elite.webp 40-cyber-looter.webp 50-rise-looter.webp; do test -s "$f"; done

      - name: Verify Cloudflare user token
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify > /tmp/userverify.json
          python3 -c "import json,sys; d=json.load(open('/tmp/userverify.json')); sys.exit(0 if d.get('success') else 1)"

      - name: Deploy Worker and static assets
        id: deploy
        shell: bash
        run: |
          set +e
          npx --yes wrangler@4 deploy > /tmp/wrangler-deploy.log 2>&1
          code=$?
          set -e
          sed -E 's/(cfut_|cfat_)[A-Za-z0-9_-]+/[REDACTED_TOKEN]/g' /tmp/wrangler-deploy.log | tail -n 120 > cloudflare-deploy-log.txt
          if [ "$code" -eq 0 ]; then echo 'outcome=success' >> "$GITHUB_OUTPUT"; else echo 'outcome=failure' >> "$GITHUB_OUTPUT"; fi
          exit 0

      - name: Record Cloudflare deployment result
        if: always()
        env:
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'status=%s\nsource_commit=%s\nstage_version=validated-eight-canonical-images\napi_token_present=%s\n' '${{ steps.deploy.outputs.outcome }}' "$(git rev-parse HEAD)" "$HAS_CF_TOKEN" > cloudflare-deploy-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-deploy-status.txt cloudflare-deploy-log.txt
          git diff --cached --quiet || (git commit -m 'Record Cloudflare deployment diagnostics' && git pull --rebase origin main && git push origin HEAD:main)

      - name: Fail when deployment failed
        if: steps.deploy.outputs.outcome != 'success'
        run: exit 1
