name: Deploy RiseLooter to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'wrangler.jsonc'
      - 'creator-cache-v23.js'
      - 'creator-hd.css'
      - 'index.html'
      - 'assets/creator/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: riselooter-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Worker and static assets
        id: deploy
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Record Cloudflare deployment result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          printf 'status=%s\nsource_commit=%s\ncreator_version=dedicated-fullbody-v23\nasset_cache=fullbody23\n' '${{ steps.deploy.outcome }}' "$GITHUB_SHA" > cloudflare-deploy-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-deploy-status.txt
          git diff --cached --quiet || (git commit -m 'Record Cloudflare deployment result' && git push origin HEAD:main)
      - name: Fail when deployment failed
        if: steps.deploy.outcome != 'success'
        run: exit 1
