<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>
RiseLooter
</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{

--bg:#03070c;

--panel:#07111a;

--panel2:#0b1620;

--line:#1e3040;

--purple:#8d3cff;

--purple2:#bf82ff;

--gold:#ffb32c;

--green:#58df87;

--red:#ff6e72;

--blue:#71b8ff;

--muted:#98a3af;

}

*{
box-sizing:border-box
}

html{
scroll-behavior:smooth
}

body{

margin:0;

background:
radial-gradient(
circle at 55% -10%,
#111827,
#04070b 45%
);

color:white;

font-family:
Arial,
Helvetica,
sans-serif;

}

button,
input{
font:inherit
}

button{

}

.hidden{
display:none!important
}

.wrapper{

width:min(
1500px,
96%
);

margin:auto;

}

header{

height:66px;

display:flex;

align-items:center;

gap:32px;

border-bottom:
1px solid #15212c;

position:sticky;

top:0;

background:
rgba(
3,
7,
12,
.96
);

z-index:60;

}

.logo{

font-size:27px;

font-weight:1000;

font-style:italic;

margin-right:auto;

}

.logo span{
color:var(--purple)
}

nav{

display:flex;

gap:32px;

}

nav button{

background:none;

border:0;

color:#c9ced6;

font-size:12px;

font-weight:800;

padding:23px 0;

}

nav button:hover{
color:var(--purple2)
}

.header-right{

display:flex;

align-items:center;

gap:9px;

}

.coin-pill{

border:
1px solid #29394a;

padding:
9px 13px;

border-radius:10px;

color:var(--gold);

font-weight:900;

}

.btn{

border:0;

border-radius:8px;

padding:
10px 15px;

font-weight:850;

color:white;

background:
linear-gradient(
#8535f2,
#5d19c4
);

}

.btn.dark{

background:#121d27;

border:
1px solid #283a4a;

}

main{
padding:15px 0 70px
}

.panel{

background:
linear-gradient(
145deg,
#09131c,
#040a10
);

border:
1px solid var(--line);

border-radius:14px;

}

.dashboard{

display:grid;

grid-template-columns:
1.16fr
1fr;

gap:14px;

}

.hero{

height:500px;

position:relative;

overflow:hidden;

background:
radial-gradient(
circle at 68% 38%,
#4a3825,
#1c1913 25%,
#070b0e 73%
);

}

.hero:after{

content:"";

position:absolute;

inset:0;

background:
linear-gradient(
90deg,
rgba(2,5,8,.5),
transparent 48%,
rgba(2,5,8,.15)
);

pointer-events:none

}

.hero-copy{

position:absolute;

left:23px;

top:21px;

z-index:6;

}

.hero-copy small{

color:#b2b8c0;

font-weight:800

}

.level-badge{

display:inline-block;

margin-left:7px;

padding:5px 8px;

border-radius:5px;

background:#7030d6;

font-size:11px;

}

.hero-copy h1{

margin:
10px 0 5px;

font-size:29px;

}

.hero-copy p{

margin:0;

color:#abb3bc;

}


/* =========================================================
   AVATAR
========================================================= */

.avatar-area{

position:absolute;

left:55%;

bottom:34px;

width:305px;

height:405px;

transform:
translateX(-50%);

z-index:4;

animation:
avatarIdle
5s
ease-in-out
infinite;

}

.avatar-area svg{

width:100%;

height:100%;

overflow:visible;

filter:
drop-shadow(
0 22px 20px rgba(0,0,0,.5)
);

}

.avatar-head{

transform-box:fill-box;

transform-origin:center bottom;

animation:
headIdle
9s
ease-in-out
infinite;

}

@keyframes avatarIdle{

0%,
100%{

transform:
translateX(-50%)
translateY(0)
rotate(-.15deg);

}

35%{

transform:
translateX(-50%)
translateY(-3px)
rotate(.25deg);

}

70%{

transform:
translateX(-50%)
translateY(0)
rotate(-.25deg);

}

}

@keyframes headIdle{

0%,
20%,
100%{
transform:rotate(0deg)
}

32%,
43%{
transform:rotate(-2.5deg)
}

62%,
75%{
transform:rotate(2.5deg)
}

}


/* =========================================================
   NEXT EVOLUTION
========================================================= */

.next-evolution{

position:absolute;

left:18px;

bottom:87px;

width:220px;

padding:13px;

background:
rgba(
4,
10,
16,
.94
);

border:
1px solid #2c4051;

border-radius:10px;

z-index:8;

}

.next-evolution small{

color:#ba6eff;

font-weight:900

}

.next-silhouette{

width:78px;

height:105px;

margin:
10px auto;

position:relative;

filter:
brightness(0);

opacity:.92;

}

.next-silhouette svg{

width:100%;

height:100%

}

.hero-track{

position:absolute;

left:24px;

right:24px;

bottom:17px;

display:grid;

grid-template-columns:
repeat(8,1fr);

z-index:8;

}

.track-node{

text-align:center;

font-size:10px;

color:#87919c;

}

.track-circle{

margin:
0 auto 5px;

display:grid;

place-items:center;

width:30px;

height:30px;

border-radius:50%;

border:
1px solid #4e5b67;

background:#081018;

}

.track-node.unlocked{

color:#ba6eff

}

.track-node.unlocked
.track-circle{

border-color:#9949ff;

box-shadow:
0 0 13px
rgba(
141,
60,
255,
.45
);

}


/* =========================================================
   PROGRESSION
========================================================= */

.progress{

padding:21px;

}

.progress h3{

font-size:14px;

margin:
0 0 23px;

}

.progress-grid{

display:grid;

grid-template-columns:
1fr 1fr;

gap:28px;

}

.level-number{

font-size:59px;

line-height:1;

font-weight:1000;

color:#a553ff;

margin:
8px 0 15px;

}

.progress-bar{

height:10px;

border-radius:20px;

background:#020508;

overflow:hidden;

}

.progress-bar div{

height:100%;

width:0;

background:
linear-gradient(
90deg,
#6821d9,
#a95dff
);

transition:
width .5s;

}

.muted{
color:var(--muted)
}

.progress-stats{

display:grid;

grid-template-columns:
repeat(3,1fr);

margin-top:22px;

border-top:
1px solid #182937;

}

.pstat{

text-align:center;

padding:
18px 5px 5px;

border-right:
1px solid #182937;

}

.pstat:last-child{
border:0
}

.pstat b{

display:block;

font-size:24px;

margin-top:8px;

}


/* =========================================================
   SECTIONS
========================================================= */

.section{

margin-top:14px;

padding:18px;

}

.section h2{

margin:
0 0 7px;

font-size:20px;

}

.section-subtitle{

color:var(--muted);

margin-bottom:17px;

}

.two-cols{

display:grid;

grid-template-columns:
1fr 1fr;

gap:14px;

}

.challenge{

display:flex;

align-items:center;

justify-content:space-between;

gap:10px;

border-bottom:
1px solid #172633;

padding:14px 4px;

cursor:pointer;

transition:.2s;

}

.challenge:hover{

padding-left:10px;

color:#c98dff;

}

.challenge:last-child{
border-bottom:0
}

.challenge-reward{

color:var(--green);

font-weight:900

}

.bonus{

margin-top:14px;

color:#c475ff;

font-weight:900;

}

.days{

display:flex;

justify-content:center;

gap:13px;

flex-wrap:wrap;

margin:
22px 0;

}

.day-wrap{
text-align:center
}

.day{

width:37px;

height:37px;

display:grid;

place-items:center;

border:
1px solid #364657;

border-radius:50%;

}

.day.on{

border-color:#a64fff;

box-shadow:
0 0 13px
rgba(
141,
60,
255,
.42
);

}

.streak-center{
text-align:center
}

.streak-big{

font-size:32px;

font-weight:1000;

color:#a751ff;

}


/* =========================================================
   MISSIONS
========================================================= */

.filters{

display:flex;

gap:8px;

}

.filter{

background:#101c27;

border:
1px solid #263848;

color:white;

padding:
8px 12px;

border-radius:8px;

}

.filter.active{

background:#7130d5;

border-color:#914cff;

}

.mission-grid{

display:grid;

grid-template-columns:
repeat(
3,
1fr
);

gap:12px;

}

.mission{

overflow:hidden;

border:
1px solid #243646;

border-radius:10px;

background:#071019;

}

.mission-image{

height:115px;

display:grid;

font-size:46px;

radial-gradient(
circle,
#274058,
#101721
);

}

.mission-body{
padding:13px
}

.mission-title{

}

.mission-reward{

color:var(--gold);

margin:
10px 0;

}


/* =========================================================

.evolution-grid{

display:grid;

repeat(8,1fr);

#05090d

inset:

svg{

.leader-row{

1fr

130px;

13px 8px;

1px solid #172633;

}

.leader-row.header{
